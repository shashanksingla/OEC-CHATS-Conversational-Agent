id: ccare_provider_agent_process
name: CCARE Provider Agent process
version: 1.25.2
description: 'CCARE provider agent turn-processing graph: intent routing, data collection, payment/attendance calc, response
  formatting.'
model: bedrock/us.anthropic.claude-sonnet-5
model_error: null
tasks:
- node_id: ccare_scope_cache_gate_py
  name: Action shortcut gate (button clicks / bare positional replies -- deterministic, no LLM)
  task_type: task
  bound_task: ccare_scope_cache_gate_py
  position: 1
  config:
    bound_task: ccare_scope_cache_gate_py
  parallel_group: null
- node_id: shortcut_matched_gate
  name: Action shortcut matched?
  task_type: decision
  bound_task: null
  position: 2
  config:
    branches:
    - value: 'YES'
      name: shortcut_matched
      source: context.shortcutResolution
      path: matched
      operator: equals
      condition_type: text
    - name: default
      condition_type: default
  parallel_group: null
- node_id: ccare_unified_intent_router
  name: Unified intent router
  task_type: task
  bound_task: ccare_unified_intent_router
  position: 3
  config:
    bound_task: ccare_unified_intent_router
  parallel_group: null
- node_id: ccare_turn_request_finalizer_py
  name: Turn request finalizer
  task_type: task
  bound_task: ccare_turn_request_finalizer_py
  position: 4
  config:
    bound_task: ccare_turn_request_finalizer_py
  parallel_group: null
- node_id: provider_validated_gate
  name: Provider session validated gate
  task_type: decision
  bound_task: null
  position: 5
  config:
    branches:
    - value: CLARIFY
      name: clarify_shortcut
      source: context.turnRequest
      path: action
      operator: equals
      condition_type: text
    - value: END
      name: end_shortcut
      source: context.turnRequest
      path: action
      operator: equals
      condition_type: text
    - value: 'YES'
      name: validated
      source: context.sessionState
      path: providerVerified
      operator: contains
      condition_type: text
    - value: 'NO'
      name: not_validated
      source: context.sessionState
      path: providerVerified
      operator: contains
      condition_type: text
    - name: default
      condition_type: default
  parallel_group: null
- node_id: ccare_provider_data_py
  name: Provider data validation
  task_type: task
  bound_task: ccare_provider_data_py
  position: 6
  config:
    bound_task: ccare_provider_data_py
  parallel_group: null
- node_id: provider_data_freshness_gate
  name: Session & data freshness gate
  task_type: decision
  bound_task: null
  position: 7
  config:
    branches:
    - value: needs_clarification
      name: needs_clarification
      source: context.ccare_provider_data_py
      path: status
      operator: contains
      condition_type: text
    - value: failed
      name: failed
      source: context.ccare_provider_data_py
      path: status
      operator: contains
      condition_type: text
    - name: default
      condition_type: default
  parallel_group: null
- node_id: ccare_data_collection
  name: Data collection
  task_type: task
  bound_task: ccare_data_collection
  position: 9
  config:
    bound_task: ccare_data_collection
  parallel_group: null
- node_id: action_dispatch
  name: Action dispatch
  task_type: decision
  bound_task: null
  position: 11
  config:
    branches:
    - value: ATTENDANCE
      name: attendance
      source: context.turnRequest
      path: action
      operator: contains
      condition_type: text
    - value: PAYMENT
      name: payment
      source: context.turnRequest
      path: action
      operator: contains
      condition_type: text
    - value: EXPLAIN
      name: explain
      source: context.turnRequest
      path: action
      operator: contains
      condition_type: text
    - value: STARTER
      name: starter
      source: context.turnRequest
      path: action
      operator: contains
      condition_type: text
    - value: CLARIFY
      name: clarify
      source: context.turnRequest
      path: action
      operator: contains
      condition_type: text
    - value: END
      name: end
      source: context.turnRequest
      path: action
      operator: equals
      condition_type: text
    - name: default
      condition_type: default
  parallel_group: null
- node_id: explain_topic_gate
  name: Explain topic gate (known topic -> deterministic; OTHER -> LLM synthesis)
  task_type: decision
  bound_task: null
  position: 12
  config:
    branches:
    - value: PAYMENT_CALCULATION
      name: known_topic
      source: context.turnRequest
      path: explainTopic
      operator: equals
      condition_type: text
    - value: ABSENCE_LIMIT_RULE
      name: known_topic
      source: context.turnRequest
      path: explainTopic
      operator: equals
      condition_type: text
    - value: CONFIRMATION_WINDOW
      name: known_topic
      source: context.turnRequest
      path: explainTopic
      operator: equals
      condition_type: text
    - value: RATE_OR_TIER
      name: known_topic
      source: context.turnRequest
      path: explainTopic
      operator: equals
      condition_type: text
    - value: AT_RISK_REASON
      name: known_topic
      source: context.turnRequest
      path: explainTopic
      operator: equals
      condition_type: text
    - name: needs_synthesis
      condition_type: default
  parallel_group: null
- node_id: ccare_explain_synthesizer
  name: Constrained LLM synthesis for non-fixed EXPLAIN questions
  task_type: task
  bound_task: ccare_explain_synthesizer
  position: 13
  config:
    bound_task: ccare_explain_synthesizer
  parallel_group: null
- node_id: engine_cache_gate
  name: Calc engine cache gate
  task_type: decision
  bound_task: null
  position: 14
  config:
    branches:
    - value: 'YES'
      name: cache_valid
      source: context.turnRequest
      path: engineCacheValid
      operator: contains
      condition_type: text
    - name: default
      condition_type: default
  parallel_group: null
- node_id: ccare_payment_engine
  name: Consolidated calc engine (payment + attendance risk + payout impact)
  task_type: task
  bound_task: ccare_payment_engine
  position: 15
  config:
    bound_task: ccare_payment_engine
  parallel_group: null
- node_id: ccare_response_formatter
  name: Deterministic response formatter (+ recommended actions)
  task_type: task
  bound_task: ccare_response_formatter
  position: 16
  config:
    bound_task: ccare_response_formatter
  parallel_group: null
- node_id: response_exit_gate
  name: Response exit gate
  task_type: decision
  bound_task: null
  position: 17
  config:
    branches:
    - value: failed
      name: end
      source: context.ccare_provider_data_py
      path: status
      operator: contains
      condition_type: text
    - value: END
      name: end
      source: context.turnRequest
      path: action
      operator: equals
      condition_type: text
    - name: continue
      condition_type: default
  parallel_group: null
- node_id: human_gate
  name: Human turn
  task_type: human
  bound_task: null
  position: 18
  config: {}
  parallel_group: null
edges:
- from: ccare_scope_cache_gate_py
  to: shortcut_matched_gate
  condition: always
- from: shortcut_matched_gate
  to: ccare_turn_request_finalizer_py
  condition: shortcut_matched
- from: shortcut_matched_gate
  to: ccare_unified_intent_router
  condition: default
- from: ccare_unified_intent_router
  to: ccare_turn_request_finalizer_py
  condition: always
- from: ccare_turn_request_finalizer_py
  to: provider_validated_gate
  condition: always
- from: provider_validated_gate
  to: ccare_response_formatter
  condition: clarify_shortcut
- from: provider_validated_gate
  to: ccare_response_formatter
  condition: end_shortcut
- from: provider_validated_gate
  to: ccare_provider_data_py
  condition: not_validated
- from: provider_validated_gate
  to: ccare_provider_data_py
  condition: default
- from: provider_validated_gate
  to: ccare_data_collection
  condition: validated
- from: ccare_provider_data_py
  to: provider_data_freshness_gate
  condition: always
- from: provider_data_freshness_gate
  to: ccare_response_formatter
  condition: needs_clarification
- from: provider_data_freshness_gate
  to: ccare_response_formatter
  condition: failed
- from: provider_data_freshness_gate
  to: ccare_data_collection
  condition: default
- from: ccare_data_collection
  to: action_dispatch
  condition: always
- from: action_dispatch
  to: engine_cache_gate
  condition: attendance
- from: action_dispatch
  to: engine_cache_gate
  condition: payment
- from: action_dispatch
  to: explain_topic_gate
  condition: explain
- from: action_dispatch
  to: engine_cache_gate
  condition: starter
- from: action_dispatch
  to: ccare_response_formatter
  condition: clarify
- from: action_dispatch
  to: ccare_response_formatter
  condition: default
- from: action_dispatch
  to: ccare_response_formatter
  condition: end
- from: explain_topic_gate
  to: ccare_response_formatter
  condition: known_topic
- from: explain_topic_gate
  to: ccare_explain_synthesizer
  condition: needs_synthesis
- from: ccare_explain_synthesizer
  to: ccare_response_formatter
  condition: always
- from: engine_cache_gate
  to: ccare_response_formatter
  condition: cache_valid
- from: engine_cache_gate
  to: ccare_payment_engine
  condition: default
- from: ccare_payment_engine
  to: ccare_response_formatter
  condition: always
- from: ccare_response_formatter
  to: response_exit_gate
  condition: always
- from: response_exit_gate
  to: null
  condition: end
- from: response_exit_gate
  to: human_gate
  condition: continue
- from: human_gate
  to: ccare_scope_cache_gate_py
  condition: always
tags:
- Child Care
created_at: '2026-08-14T11:10:21.136879Z'
updated_at: '2026-09-30T20:25:59.943129Z'
