<template>
    <!-- Loading spinner -->
    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>

    <!-- Page messages -->
    <template if:true={pageMessages}>
        <div class="slds-m-bottom_small">
            <template for:each={pageMessages} for:item="message">
                <div key={message} class={messageType}>
                    <lightning-formatted-text value={message}></lightning-formatted-text>
                </div>
            </template>
        </div>
    </template>

    <lightning-card icon-name="standard:work_plan_template">
        <!-- Title -->
        <h1 slot="title" class="slds-page-header__title" title="State Tax Intercept">State Tax Intercept</h1>

        <div class="slds-p-horizontal_small">
            <!-- Search Filter Fields -->
            <lightning-layout multiple-rows="true" horizontal-align="space">
                <template if:true={searchWrapper}>
                    <lightning-layout-item flexibility="auto" size="4"
                        class="slds-p-vertical_x-small slds-p-horizontal_small">
                        <c-multiselect-combobox label="County" value-list={searchWrapper.selectedCounty} object="User"
                            field="Owner_County__c" required="true" onselect={handleComboboxUpdates} multi-select>
                        </c-multiselect-combobox>
                    </lightning-layout-item>

                    <lightning-layout-item flexibility="auto" size="4"
                        class="slds-p-vertical_x-small slds-p-horizontal_small">
                        <lightning-combobox label="Tax Year" name="Tax_Year__c"
                            value={searchWrapper.taxRecord.Tax_Year__c} options={taxYearOptions} required="true"
                            onchange={handleInputChange}>
                        </lightning-combobox>
                    </lightning-layout-item>

                    <lightning-layout-item flexibility="auto" size="4"
                        class="slds-p-vertical_x-small slds-p-horizontal_small">
                        <lightning-input type="text" label="Name" name="Name__c" value={searchWrapper.taxRecord.Name__c}
                            onchange={handleInputChange}>
                        </lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item flexibility="auto" size="4"
                        class="slds-p-vertical_x-small slds-p-horizontal_small">
                        <c-multiselect-combobox label="Type" name="Type__c" value={searchWrapper.taxRecord.Type__c}
                            object="Tax_Intercept__c" field="Type__c" onselect={handleComboboxUpdates}
                            show-none behavior-type="picklist">
                        </c-multiselect-combobox>
                    </lightning-layout-item>

                    <lightning-layout-item flexibility="auto" size="4"
                        class="slds-p-vertical_x-small slds-p-horizontal_small">
                        <lightning-record-picker label="Case ID" name="CaseId" placeholder=""
                            object-api-name="T_SBSD_CASE__c" matching-info={matchingInfoCase}
                            value={searchWrapper.taxRecord.Case__c} onchange={handleLookupSelection}>
                        </lightning-record-picker>
                    </lightning-layout-item>

                    <lightning-layout-item flexibility="auto" size="4"
                        class="slds-p-vertical_x-small slds-p-horizontal_small">
                        <lightning-input pattern="[0-9]{0,9}" message-when-pattern-mismatch="Please enter a valid SSN"
                            maxlength="9" type="text" label="SSN" name="SSN__c" value={searchWrapper.taxRecord.SSN__c}
                            onchange={handleInputChange}>
                        </lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item flexibility="auto" size="4"
                        class="slds-p-vertical_x-small slds-p-horizontal_small">
                        <lightning-record-picker label="Adjustment ID" name="AdjustmentId" placeholder=""
                            object-api-name="T_ADJMT__c" matching-info={matchingInfoAdj}
                            value={searchWrapper.taxRecord.Adjustment__c} onchange={handleLookupSelection}>
                        </lightning-record-picker>
                    </lightning-layout-item>

                    <lightning-layout-item flexibility="auto" size="4"
                        class="slds-p-vertical_x-small slds-p-horizontal_small">
                        <lightning-record-picker label="Provider ID" name="ProviderId" placeholder=""
                            object-api-name="T_CHATS_PROVR_STATUS__c" matching-info={matchingInfoProvider}
                            value={searchWrapper.taxRecord.Provider__c} onchange={handleLookupSelection}>
                        </lightning-record-picker>
                    </lightning-layout-item>

                    <lightning-layout-item flexibility="auto" size="4"
                        class="slds-p-vertical_x-small slds-p-horizontal_small">
                        <c-multiselect-combobox label="Recovery Reason" value-list={searchWrapper.recoveryReason}
                            multi-select object="Tax_Intercept__c" field="Recovery_Reason__c"
                            onselect={handleComboboxUpdates} show-none>
                        </c-multiselect-combobox>
                    </lightning-layout-item>

                    <lightning-layout-item flexibility="auto" size="4"
                        class="slds-p-vertical_x-small slds-p-horizontal_small">
                        <c-multiselect-combobox label="Classification" name="Classification__c"
                            value={searchWrapper.taxRecord.Classification__c} object="Tax_Intercept__c"
                            field="Classification__c" show-none="true" onselect={handleComboboxUpdates}
                            behavior-type="picklist">
                        </c-multiselect-combobox>
                    </lightning-layout-item>
                    <lightning-layout-item size="8"></lightning-layout-item>
                </template>
                <!-- Buttons -->
                <lightning-layout-item size="12">
                    <div class="slds-float_right">
                        <lightning-button variant="neutral" label="Clear" onclick={clearScreen}
                            class="slds-m-right_x-small">
                        </lightning-button>
                        <lightning-button variant="brand" label="Search" onclick={search}>
                        </lightning-button>
                    </div>
                </lightning-layout-item>
            </lightning-layout>

            <!-- Search Results -->
            <div if:true={hasSearchResults}>
                <lightning-layout>
                    <lightning-layout-item flexibility="auto" size="12" class="slds-m-left_small">
                        <h3 class="slds-section__title">State Tax Intercept Results ({searchResultCount})</h3>
                        <h5 class="slds-text-color_weak" style="padding-bottom: 0.7rem;">Click on an Intercept ID to
                            view details</h5>
                    </lightning-layout-item>
                </lightning-layout>

                <div style="border: 1px solid #c9c9c9">
                    <div onhyperlinkclick={handleHyperlinkClick}>
                        <c-custom-datatable key-field="Id" data={searchResults} columns={columns} sorted-by={sortField}
                            sorted-direction={sortDirection} onsort={handleSort} hide-checkbox-column>
                        </c-custom-datatable>
                    </div>
                </div>
            </div>
        </div>

        <!-- Details Modal -->
        <c-tax-intercept-details_lwc tax-record={selectedRecord} remove-reason={removeReason}
            show-details-modal={showDetailsModal} remove-access={removeAccessSingle} is-admin={isAdmin}
            onclose={handleModalClose} ontaxrecordupdate={handleTaxRecordUpdate}>
        </c-tax-intercept-details_lwc>

    </lightning-card>
</template>
