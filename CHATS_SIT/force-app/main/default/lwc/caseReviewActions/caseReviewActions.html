<template>
    <template lwc:if={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="base"></lightning-spinner>
    </template>

    <lightning-layout multiple-rows>
        <lightning-layout-item flexibility="auto" size="12"
            class="slds-p-vertical_large slds-p-horizontal_small slds-m-bottom_small slds-align_absolute-center"
            style="background:white;border-radius: 5px;">
            <lightning-button label="Delete" data-name="delete" onclick={handleButtonClick} variant="brand">
            </lightning-button>
        </lightning-layout-item>
         <lightning-layout-item flexibility="auto" size="12"
            class="slds-p-vertical_large slds-p-horizontal_small slds-m-bottom_small slds-align_absolute-center"
            style="background:white;border-radius: 5px;">
            <lightning-button label="View Case Review" data-name="view" onclick={handleButtonClick}
                variant="brand">
            </lightning-button>
        </lightning-layout-item>
        <lightning-layout-item flexibility="auto" size="12"
            class="slds-p-vertical_large slds-p-horizontal_small slds-m-bottom_small slds-align_absolute-center"
            style="background:white;border-radius: 5px;">
            <lightning-button label="Review Case Review" data-name="review" onclick={handleButtonClick}
                variant="brand">
            </lightning-button>
        </lightning-layout-item>
        <template lwc:if={showReversalButtons}>
            <lightning-layout-item flexibility="auto" size="12"
                class="slds-p-vertical_large slds-p-horizontal_small slds-m-bottom_small slds-align_absolute-center"
                style="background:white;border-radius: 5px;">
                <lightning-button label="Submit for State Reversal" data-name="submitForReversal"
                    onclick={handleButtonClick} variant="brand">
                </lightning-button>
            </lightning-layout-item>
            <lightning-layout-item flexibility="auto" size="12"
                class="slds-p-vertical_large slds-p-horizontal_small slds-align_absolute-center"
                style="background:white;border-radius: 5px;">
                <lightning-button label="Submit to Reviewee" data-name="submitToReviewee"
                    onclick={handleButtonClick} variant="brand">
                </lightning-button>
            </lightning-layout-item>
        </template>
    </lightning-layout>
</template>
