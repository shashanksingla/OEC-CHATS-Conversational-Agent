<template>
    <lightning-card icon-name="standard:event">
        <div slot="title">
            <div class="slds-grid">
                <div class="slds-col slds-has-flexi-truncate">
                    <div class="slds-media slds-no-space slds-grow">
                        <div class="slds-media__body">
                            <p class="slds-text-title_caps slds-line-height_reset">
                                <lightning-formatted-text value="View"></lightning-formatted-text>
                            </p>
                            <h1 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate"
                                title="Authorization">Authorization Encumbrance History</h1>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div slot="actions">
            <lightning-button variant="neutral" label="Cancel" onclick={handleCancelClick}></lightning-button>
        </div>
        <div class="slds-p-horizontal_small">
            <lightning-layout multiple-rows vertical-align="end">
                <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                    <lightning-combobox
                        name="month"
                        label="Month:"
                        value={selectedMonth}
                        options={months}
                        required
                        onchange={handleMonthChange}>
                    </lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" padding="around-small" size="2">
                    <lightning-input
                        type="number"
                        name="year"
                        label="Year:"
                        value={selectedYear}
                        required
                        min="2000"
                        max="3000"
                        step="1"
                        onchange={handleYearChange}>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" padding="around-small" size="4" class="slds-align-bottom">
                    <lightning-button variant="brand" label="View" onclick={handleViewClick}></lightning-button>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" padding="around-small" size="12">
                    <c-auth-encumbrance-related-list_-l-w-c
                        record-id={recordId}
                        is-month-yr-based-search="true"
                        show-more="false"
                        related-list-header="Authorization Encumbrance">
                    </c-auth-encumbrance-related-list_-l-w-c>
                </lightning-layout-item>
            </lightning-layout>
        </div>
    </lightning-card>
</template>
