<template>
    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="base"></lightning-spinner>
    </template>
    
    <!-- Modal/Popup Box starts here-->
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_small">
        <div class="slds-modal__container">
            <!-- Modal/Popup Box Header Starts here-->
            <header class="slds-modal__header">
                <lightning-button-icon 
                    icon-name="utility:close"
                    onclick={closeModel}
                    alternative-text="close"
                    variant="bare-inverse"
                    class="slds-modal__close">
                </lightning-button-icon>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Edit Authorization Recurrence Pattern</h2>
            </header>
            <!--Modal/Popup Box Body Starts here-->
            <div class="slds-modal__content slds-p-around_small" id="modal-content-id-1">
                <template if:true={initDataLoaded}>
                    <lightning-card icon-name="standard:event">
                        <c-page-messages_lwc page-messages={recordError} message-type={message}></c-page-messages_lwc>
                        <c-recurrence-patten-pg1_lwc 
                            record-id={recordId}
                            auth-sch-recurr-obj={authSchRecurrObj}
                            is-valid={isValid}
                            field-validation-errors={fieldValidationErrors}
                            is-current-page-valid={isCurrentPageValid}
                            auth-end-date={authEndDate}
                            onvalidatepage={handleValidatePage}
                            onrecorderror={handleRecordError}>
                        </c-recurrence-patten-pg1_lwc>
                    </lightning-card>
                </template>
            </div>
            <!--Modal/Popup Box Footer Starts here-->
            <footer class="slds-modal__footer">
                <lightning-button label="Save" variant="brand" onclick={doFinish}></lightning-button>
                <lightning-button label="Cancel" onclick={doCancel}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
