<template>
    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>
    <lightning-card>
        <template if:true={isAccessible}>
            <div style="padding: 0rem 1rem 0rem 1rem;">
                <lightning-record-form record-id={recordId} object-api-name="Case_Review__c"
                    layout-type="Full" columns="2" mode="readonly"></lightning-record-form>
            </div>
        </template>
        <template if:false={isAccessible}>
            <lightning-formatted-text value="This record has restricted access. Please contact your supervisor if access is required."></lightning-formatted-text>
        </template>
    </lightning-card>
</template>
