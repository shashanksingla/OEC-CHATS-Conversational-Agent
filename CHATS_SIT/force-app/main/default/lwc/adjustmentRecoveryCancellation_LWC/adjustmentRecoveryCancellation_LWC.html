<template>
    <template lwc:if = {showComponent}>
        <template lwc:if = {showSpinner}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <c-page-messages_lwc
            page-messages={recordError}
            message-type={messageType}>
        </c-page-messages_lwc>

        <template lwc:if ={hasAdjCancellationRecord}>
            <lightning-record-edit-form
                record-id={adjCancellationRecordId}
                object-api-name="T_ADJMT_CANCEL__c"
                onsuccess={handleSuccess}
                onerror={handleError}>

                <div class="slds-grid slds-wrap slds-gutters">

                    <!-- Row 1: Record ID | CDE_STATUS__c -->
                    <div class="slds-col slds-size_6-of-12">
                        <div class="slds-form-element">
                            <!--label class="slds-form-element__label">Record Id</label-->
                            <div class="slds-form-element__control">
                                <template lwc:if = {hasRecordId}>
                                    <a href="javascript:void(0);" onclick={redirectToCancellation}>
                                        {adjCancellationRecordName}
                                    </a>
                                </template>
                                <template lwc:else>
                                    <lightning-output-field field-name="Name"></lightning-output-field>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_6-of-12">
                        <lightning-input-field
                            field-name="CDE_STATUS__c"
                            required
                            disabled={isStatusDisabled}>
                        </lightning-input-field>
                    </div>

                    <!-- Row 2: CDE_RSN_CANCELLATION__c | DTE_DISC_CANCELLATION__c -->
                    <div class="slds-col slds-size_6-of-12">
                        <lightning-input-field
                            field-name="CDE_RSN_CANCELLATION__c"
                            required
                            data-field="reason"
                            disabled={isReasonDisabled}>
                        </lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_6-of-12">
                        <lightning-input-field
                            field-name="DTE_DISC_CANCELLATION__c"
                            required
                            data-field="discovery"
                            disabled={isDiscDateDisabled}>
                        </lightning-input-field>
                    </div>

                    <!-- Row 3: RSN_CANCEL_SUBJECT__c | empty -->
                    <div class="slds-col slds-size_6-of-12">
                        <lightning-input-field
                            field-name="RSN_CANCEL_SUBJECT__c"
                            required
                            data-field="cancelSubject"
                            disabled={isSubjectDisabled}>
                        </lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_6-of-12"></div>

                    <!-- Row 4: RSN_CANCEL_BODY__c (full width) -->
                    <div class="slds-col slds-size_12-of-12">
                        <lightning-input-field
                            field-name="RSN_CANCEL_BODY__c"
                            required
                            data-field="cancelBody"
                            disabled={isBodyDisabled}>
                        </lightning-input-field>
                    </div>

                    <lightning-input-field
                        field-name="IDN_ADJMT__c"
                        value={adjCancellationRecordAdjmtId}
                        class="slds-hide">
                    </lightning-input-field>
                    <lightning-input-field
                        field-name="CDE_STATUS__c"
                        value={submitStatus}
                        class="slds-hide">
                    </lightning-input-field>

                </div>

            <!-- Buttons Row -->
            <div class="slds-grid slds-gutters slds-m-top_medium">
                <div class="slds-col slds-grid slds-grid_align-end">
                    <!-- Cancel -->
                    <lightning-button
                        label="Cancel"
                        variant="neutral"
                        class="slds-m-right_x-small"
                        onclick={closePopUp}>
                    </lightning-button>

                    <!-- Withdraw -->
                    <lightning-button
                        label="Withdraw"
                        variant="neutral"
                        class="slds-m-right_x-small"
                        disabled={isWithdrawDisabled}
                        onclick={handleWithdrawCancellation}>
                    </lightning-button>

                    <!-- Submit -->
                    <lightning-button
                        label="Submit"
                        variant="brand"
                        class="slds-m-right_x-small"
                        disabled={isSubmitDisabled}
                        onclick={handleSubmitCancellation}>
                    </lightning-button>

                    <!-- Save -->
                    <lightning-button
                        label="Save"
                        variant="brand"
                        disabled={isSaveDisabled}
                        onclick={handleSaveCancellation}>
                    </lightning-button>
                </div>
            </div>

            </lightning-record-edit-form>
        </template>

        <!-- SLDS Confirmation Modal -->
        <template lwc:if ={showConfirmDialog}>
            <div role="dialog" tabindex="-1" aria-labelledby="modal-heading" aria-modal="true" aria-describedby="modal-content" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    <!-- Modal Header -->
                    <header class="slds-modal__header">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={hideConfirmModal}>
                            <lightning-icon
                                icon-name="utility:close"
                                alternative-text="Close"
                                size="small">
                            </lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading" class="slds-modal__title slds-hyphenate">Confirmation</h2>
                    </header>

                    <!-- Modal Body -->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content">
                        <p>{reminderMsg}</p>
                    </div>

                    <!-- Modal Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Ok"
                            variant="neutral"
                            class="slds-m-right_x-small"
                            onclick={handleWarningAccept}>
                        </lightning-button>
                        <lightning-button
                            label="Continue"
                            variant="brand"
                            onclick={handleContinue}>
                        </lightning-button>
                    </footer>

                </div>
            </div>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </template>
</template>
