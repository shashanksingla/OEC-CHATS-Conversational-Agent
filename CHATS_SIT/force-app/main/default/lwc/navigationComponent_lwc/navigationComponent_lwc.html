<template>
    <!-- Normal zoom mode: button group (zoom < 200%) -->
    <template lwc:if={showButtonGroup}>
        <lightning-button-group>
            <template for:each={visibleButtons} for:item="btn">
                <lightning-button key={btn.key} label={btn.label} variant={btn.variant} onclick={handleButtonClick}
                    data-key={btn.key} disabled={btn.disabled} class={btn.cssClass}>
                </lightning-button>
                <template lwc:if={btn.showHelpText}>
                    <lightning-helptext key={btn.key} content={btn.helpText}></lightning-helptext>
                </template>
            </template>
        </lightning-button-group>
    </template>

    <!-- High zoom mode: primary button + overflow menu (zoom >= 200%) -->
    <template lwc:if={showMenuMode}>
        <lightning-button-group>
            <!-- Primary action button always visible -->
            <template lwc:if={primaryButton}>
                <lightning-button label={primaryButton.label} variant={primaryButton.variant}
                    onclick={handleButtonClick} data-key={primaryButton.key} disabled={primaryButton.disabled}>
                </lightning-button>
            </template>

            <!-- Overflow menu for remaining buttons -->
            <template lwc:if={hasMenuItems}>
                <lightning-button-menu alternative-text="More actions" variant="border-filled" menu-alignment="right"
                    onselect={handleMenuSelect}>
                    <template for:each={menuButtons} for:item="menuBtn">
                        <lightning-menu-item key={menuBtn.key} value={menuBtn.key} label={menuBtn.label}
                            disabled={menuBtn.disabled}>
                        </lightning-menu-item>
                    </template>
                </lightning-button-menu>
            </template>
        </lightning-button-group>
    </template>
</template>
