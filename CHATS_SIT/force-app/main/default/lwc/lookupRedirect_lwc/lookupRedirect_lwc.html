<template>
    <template lwc:if={hasRecordId}>
        <template lwc:if={error}>
            <span class="slds-text-color_error">{error}</span>
        </template>
        <div class="outputLookupContainer forceOutputLookupWithPreview">
            <a 
                class="textUnderline outputLookupLink slds-truncate forceOutputLookup"
                data-refid="recordId"
                data-recordid={recordId}
                href={recordUrl}
                onclick={handleNavigateToRecord}
                title={recordName}>
                {recordName}
            </a>
        </div>
    </template>
</template>
