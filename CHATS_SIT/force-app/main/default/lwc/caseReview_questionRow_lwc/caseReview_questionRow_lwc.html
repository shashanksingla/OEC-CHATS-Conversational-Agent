<template>
    <template if:false={isViewMode}>
        <lightning-layout multiple-rows>

            <!-- Element Header & Main Question Picklist -->
            <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="12">
                <div style="font-size: 1rem; padding-bottom: 0.2rem;">
                    Element #{responseWrapper.questionRec.Order__c}: {responseWrapper.questionRec.Element__c}
                    <span style="vertical-align: bottom; padding-left: 0.4rem;">
                        <lightning-helptext content={responseWrapper.questionRec.Review_Requirement__c}></lightning-helptext>
                    </span>
                </div>
                <c-multiselect-combobox behavior-type="picklist"
                    label={responseWrapper.questionRec.Question__c}
                    aria-label={responseWrapper.questionRec.Question__c}
                    data-id="input-field"
                    value={responseWrapper.responseRec.CaseReview_QuestionMain__c}
                    disabled={isRevieweeAccess}
                    object="Case_Review_Response__c"
                    field="CaseReview_QuestionMain__c"
                    required already-has-values
                    options={responseWrapper.elementQuestionOptions}
                    onselect={handlePicklistChange}>
                </c-multiselect-combobox>
            </lightning-layout-item>

            <!-- Errors & Causes section — only shown when Hide_Errors_and_Causes__c is false -->
            <template if:false={hideErrorsAndCauses}>

                <!-- Causes Payment Error — shown when main answer is NO -->
                <lightning-layout-item flexibility="auto" size="12" class={noAnswerClass}>
                    <c-multiselect-combobox behavior-type="picklist"
                        label="Did this cause a payment error?"
                        aria-label="Did this cause a payment error?"
                        data-id="input-field"
                        value={responseWrapper.responseRec.Causes_Payment_Error__c}
                        object="Case_Review_Response__c"
                        field="Causes_Payment_Error__c"
                        required={isError1Required}
                        show-none
                        disabled={isRevieweeAccess}
                        onselect={handlePicklistChange}>
                    </c-multiselect-combobox>
                </lightning-layout-item>

                <!-- N/A Reason — shown when main answer is NA -->
                <lightning-layout-item flexibility="auto" size="12" class={naAnswerClass}>
                    <c-multiselect-combobox behavior-type="picklist"
                        label="If N/A, Reason:"
                        aria-label="If N/A, Reason:"
                        data-id="input-field"
                        value={responseWrapper.responseRec.CaseReview_NA_Reason__c}
                        disabled={isNAReasonFieldDisabled}
                        object="Case_Review_Response__c"
                        field="CaseReview_NA_Reason__c"
                        required={isNARequired}
                        already-has-values
                        options={responseWrapper.NAReasonOptions}
                        onselect={handlePicklistChange}>
                    </c-multiselect-combobox>
                </lightning-layout-item>

                <!-- Error #1 — shown when main answer is NO -->
                <lightning-layout-item flexibility="auto" size="6" class={noAnswerClass}>
                    <c-multiselect-combobox behavior-type="picklist"
                        label="If No, Reason for Error #1:"
                        aria-label="If No, Reason for Error #1:"
                        data-id="input-field"
                        value={responseWrapper.responseRec.CaseReview_Error1__c}
                        required={isError1Required}
                        object="Case_Review_Response__c"
                        field="CaseReview_Error1__c"
                        already-has-values
                        options={caseReviewError1Options}
                        disabled={isRevieweeAccess}
                        onselect={handlePicklistChange}>
                    </c-multiselect-combobox>
                </lightning-layout-item>

                <!-- Cause #1 — shown when main answer is NO -->
                <lightning-layout-item flexibility="auto" size="6" class={noAnswerClass}>
                    <c-multiselect-combobox behavior-type="picklist"
                        label="Cause"
                        aria-label="Cause for Error #1"
                        data-id="input-field"
                        value={responseWrapper.responseRec.CaseReview_Cause1__c}
                        required={isCause1Required}
                        object="Case_Review_Response__c"
                        field="CaseReview_Cause1__c"
                        already-has-values
                        options={caseReviewError1Cause}
                        disabled={isRevieweeAccess}
                        onselect={handlePicklistChange}>
                    </c-multiselect-combobox>
                </lightning-layout-item>

                <!-- Error #2 — shown when main answer is NO -->
                <lightning-layout-item flexibility="auto" size="6" class={noAnswerClass}>
                    <c-multiselect-combobox behavior-type="picklist"
                        label="If No, Reason for Error #2:"
                        aria-label="If No, Reason for Error #2:"
                        data-id="input-field"
                        value={responseWrapper.responseRec.CaseReview_Error2__c}
                        object="Case_Review_Response__c"
                        field="CaseReview_Error2__c"
                        already-has-values
                        options={caseReviewError2Options}
                        disabled={isRevieweeAccess}
                        onselect={handlePicklistChange}>
                    </c-multiselect-combobox>
                </lightning-layout-item>

                <!-- Cause #2 — shown when main answer is NO -->
                <lightning-layout-item flexibility="auto" size="6" class={noAnswerClass}>
                    <c-multiselect-combobox behavior-type="picklist"
                        label="Cause"
                        aria-label="Cause for Error #2"
                        data-id="input-field"
                        value={responseWrapper.responseRec.CaseReview_Cause2__c}
                        required={isCause2Required}
                        object="Case_Review_Response__c"
                        field="CaseReview_Cause2__c"
                        already-has-values
                        options={caseReviewError2Cause}
                        disabled={isRevieweeAccess}
                        onselect={handlePicklistChange}>
                    </c-multiselect-combobox>
                </lightning-layout-item>

                <!-- Error #3 — shown when main answer is NO -->
                <lightning-layout-item flexibility="auto" size="6" class={noAnswerClass}>
                    <c-multiselect-combobox behavior-type="picklist"
                        label="If No, Reason for Error #3:"
                        aria-label="If No, Reason for Error #3:"
                        data-id="input-field"
                        value={responseWrapper.responseRec.CaseReview_Error3__c}
                        object="Case_Review_Response__c"
                        field="CaseReview_Error3__c"
                        already-has-values
                        options={caseReviewError3Options}
                        disabled={isRevieweeAccess}
                        onselect={handlePicklistChange}>
                    </c-multiselect-combobox>
                </lightning-layout-item>

                <!-- Cause #3 — shown when main answer is NO -->
                <lightning-layout-item flexibility="auto" size="6" class={noAnswerClass}>
                    <c-multiselect-combobox behavior-type="picklist"
                        label="Cause"
                        aria-label="Cause for Error #3"
                        data-id="input-field"
                        value={responseWrapper.responseRec.CaseReview_Cause3__c}
                        required={isCause3Required}
                        object="Case_Review_Response__c"
                        field="CaseReview_Cause3__c"
                        already-has-values
                        options={caseReviewError3Cause}
                        disabled={isRevieweeAccess}
                        onselect={handlePicklistChange}>
                    </c-multiselect-combobox>
                </lightning-layout-item>

                <!-- Error #4 — shown when main answer is NO -->
                <lightning-layout-item flexibility="auto" size="6" class={noAnswerClass}>
                    <c-multiselect-combobox behavior-type="picklist"
                        label="If No, Reason for Error #4:"
                        aria-label="If No, Reason for Error #4:"
                        data-id="input-field"
                        value={responseWrapper.responseRec.CaseReview_Error4__c}
                        object="Case_Review_Response__c"
                        field="CaseReview_Error4__c"
                        already-has-values
                        options={caseReviewError4Options}
                        disabled={isRevieweeAccess}
                        onselect={handlePicklistChange}>
                    </c-multiselect-combobox>
                </lightning-layout-item>

                <!-- Cause #4 — shown when main answer is NO -->
                <lightning-layout-item flexibility="auto" size="6" class={noAnswerClass}>
                    <c-multiselect-combobox behavior-type="picklist"
                        label="Cause"
                        aria-label="Cause for Error #4"
                        data-id="input-field"
                        value={responseWrapper.responseRec.CaseReview_Cause4__c}
                        required={isCause4Required}
                        object="Case_Review_Response__c"
                        field="CaseReview_Cause4__c"
                        already-has-values
                        options={caseReviewError4Cause}
                        disabled={isRevieweeAccess}
                        onselect={handlePicklistChange}>
                    </c-multiselect-combobox>
                </lightning-layout-item>

            </template>
            <!-- End Errors & Causes section -->

            <!-- Observation Details & Comments -->
            <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_xx-small slds-p-horizontal_small">
                <lightning-textarea max-length="4000"
                    label="Observation Details &amp; Comments (required for elements)"
                    aria-label="Observation Details and Comments (required for elements)"
                    data-id="input-field"
                    data-field="Observation_Details_Comments__c"
                    value={responseWrapper.responseRec.Observation_Details_Comments__c}
                    disabled={isRevieweeAccess}
                    onchange={handleInputChange}>
                </lightning-textarea>
            </lightning-layout-item>

            <!-- Action Required Picklist -->
            <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_xx-small slds-p-horizontal_small">
                <c-multiselect-combobox behavior-type="picklist"
                    label="Is Action Required to Correct Case Before Next Re-determination?"
                    aria-label="Is Action Required to Correct Case Before Next Re-determination?"
                    data-id="input-field"
                    value={responseWrapper.responseRec.Action_Required__c}
                    disabled={isRevieweeAccess}
                    object="Case_Review_Response__c"
                    field="Action_Required__c"
                    required={isActionRequired}
                    show-none
                    onselect={handlePicklistChange}>
                </c-multiselect-combobox>
            </lightning-layout-item>

            <!-- Actions Taken — shown when Action Required = Y -->
            <lightning-layout-item flexibility="auto" size="12" class={actionRequiredClass}>
                <lightning-textarea max-length="4000"
                    label="Actions Taken"
                    aria-label="Actions Taken"
                    data-id="input-field"
                    data-field="Action_Taken__c"
                    value={responseWrapper.responseRec.Action_Taken__c}
                    required={isActionTakenRequired}
                    onchange={handleInputChange}>
                </lightning-textarea>
            </lightning-layout-item>

            <!-- Date of Action Taken — shown when Action Required = Y -->
            <lightning-layout-item flexibility="auto" size="12" class={actionRequiredClass}>
                <lightning-input
                    type="date"
                    label="Date of Action Taken"
                    aria-label="Date of Action Taken"
                    data-id="input-field"
                    data-field="Action_Date__c"
                    value={responseWrapper.responseRec.Action_Date__c}
                    required={isActionDateRequired}
                    onchange={handleInputChange}>
                </lightning-input>
            </lightning-layout-item>

            <!-- Spacer -->
            <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_x-small"></lightning-layout-item>

        </lightning-layout>
    </template>

    <template if:true={isViewMode}>
        <hr style="margin: 0; border: 0; height: 1px; background: gray; opacity: 40%;">
        <lightning-layout multiple-rows>

            <!-- Element Header & Main Question Read-Only -->
            <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="12">
                <div style="font-size: 1rem; padding-bottom: 0.2rem;">
                    Element #{responseWrapper.questionRec.Order__c}: {responseWrapper.questionRec.Element__c}
                </div>
                <span class="slds-form-element__label">{responseWrapper.questionRec.Question__c}</span>
                <div class="slds-form-element__static">{responseWrapper.responseRec.CaseReview_QuestionMain__c}</div>
            </lightning-layout-item>

            <!-- Errors & Causes read-only section — only shown when Hide_Errors_and_Causes__c is false -->
            <template if:false={hideErrorsAndCauses}>

                <!-- Causes Payment Error read-only — shown when main answer is No -->
                <lightning-layout-item flexibility="auto" size="12" class={noAnswerViewClass}>
                    <span class="slds-form-element__label">Did this cause a payment error?</span>
                    <div class="slds-form-element__static">{responseWrapper.responseRec.Causes_Payment_Error__c}</div>
                </lightning-layout-item>

                <!-- N/A Reason read-only — shown when main answer is N/A -->
                <lightning-layout-item flexibility="auto" size="12" class={naAnswerViewClass}>
                    <span class="slds-form-element__label">If N/A, Reason:</span>
                    <div class="slds-form-element__static">{responseWrapper.responseRec.CaseReview_NA_Reason__c}</div>
                </lightning-layout-item>

                <!-- Error #1 / Cause #1 table row — shown when main answer is No -->
                <lightning-layout-item flexibility="auto" size="12" class={noAnswerViewClass}>
                    <table>
                        <tr>
                            <td style="width: 50%;">
                                <span class="slds-form-element__label">If No, Reason for Error #1:</span>
                                <div class="slds-form-element__static">{responseWrapper.responseRec.CaseReview_Error1__c}</div>
                            </td>
                            <td style="width: 50%;">
                                <span class="slds-form-element__label">Cause:</span>
                                <div class="slds-form-element__static">{responseWrapper.responseRec.CaseReview_Cause1__c}</div>
                            </td>
                        </tr>
                    </table>
                </lightning-layout-item>

                <!-- Error #2 / Cause #2 table row — shown when Error2 has a value -->
                <lightning-layout-item flexibility="auto" size="12" class={error2ViewClass}>
                    <table>
                        <tr>
                            <td style="width: 50%;">
                                <span class="slds-form-element__label">If No, Reason for Error #2:</span>
                                <div class="slds-form-element__static">{responseWrapper.responseRec.CaseReview_Error2__c}</div>
                            </td>
                            <td style="width: 50%;">
                                <span class="slds-form-element__label">Cause:</span>
                                <div class="slds-form-element__static">{responseWrapper.responseRec.CaseReview_Cause2__c}</div>
                            </td>
                        </tr>
                    </table>
                </lightning-layout-item>

                <!-- Error #3 / Cause #3 table row — shown when Error3 has a value -->
                <lightning-layout-item flexibility="auto" size="12" class={error3ViewClass}>
                    <table>
                        <tr>
                            <td style="width: 50%;">
                                <span class="slds-form-element__label">If No, Reason for Error #3:</span>
                                <div class="slds-form-element__static">{responseWrapper.responseRec.CaseReview_Error3__c}</div>
                            </td>
                            <td style="width: 50%;">
                                <span class="slds-form-element__label">Cause:</span>
                                <div class="slds-form-element__static">{responseWrapper.responseRec.CaseReview_Cause3__c}</div>
                            </td>
                        </tr>
                    </table>
                </lightning-layout-item>

                <!-- Error #4 / Cause #4 table row — shown when Error4 has a value -->
                <lightning-layout-item flexibility="auto" size="12" class={error4ViewClass}>
                    <table>
                        <tr>
                            <td style="width: 50%;">
                                <span class="slds-form-element__label">If No, Reason for Error #4:</span>
                                <div class="slds-form-element__static">{responseWrapper.responseRec.CaseReview_Error4__c}</div>
                            </td>
                            <td style="width: 50%;">
                                <span class="slds-form-element__label">Cause:</span>
                                <div class="slds-form-element__static">{responseWrapper.responseRec.CaseReview_Cause4__c}</div>
                            </td>
                        </tr>
                    </table>
                </lightning-layout-item>

            </template>
            <!-- End Errors & Causes read-only section -->

            <!-- Observation Details & Comments read-only -->
            <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_x-small slds-p-horizontal_small">
                <span class="slds-form-element__label">Observation Details &amp; Comments (required for elements)</span>
                <div class="slds-form-element__static">{responseWrapper.responseRec.Observation_Details_Comments__c}</div>
            </lightning-layout-item>

            <!-- Action Required read-only -->
            <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_x-small slds-p-horizontal_small">
                <span class="slds-form-element__label">Is Action Required to Correct Case Before Next Re-determination?</span>
                <div class="slds-form-element__static">{responseWrapper.responseRec.Action_Required__c}</div>
            </lightning-layout-item>

            <!-- Actions Taken read-only — shown when Action Required = Yes -->
            <lightning-layout-item flexibility="auto" size="12" class={actionRequiredViewClass}>
                <span class="slds-form-element__label">Actions Taken</span>
                <div class="slds-form-element__static">{responseWrapper.responseRec.Action_Taken__c}</div>
            </lightning-layout-item>

            <!-- Date of Action Taken read-only — shown when Action Required = Yes -->
            <lightning-layout-item flexibility="auto" size="12" class={actionRequiredViewClass}>
                <span class="slds-form-element__label">Date of Action Taken</span>
                <div class="slds-form-element__static">
                    <lightning-formatted-date-time time-zone="UTC"
                        value={responseWrapper.responseRec.Action_Date__c}
                        day="numeric"
                        month="numeric"
                        year="numeric">
                    </lightning-formatted-date-time>
                </div>
            </lightning-layout-item>

        </lightning-layout>

    </template>
</template>
