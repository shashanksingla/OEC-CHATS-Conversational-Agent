<template>
    <template lwc:if={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="base"></lightning-spinner>
    </template>

    <lightning-card lwc:if={isDetail}>
        <template lwc:if={isAccessible}>
            <div style="padding: 0rem 1rem 0rem 1rem;">
                <lightning-record-form record-id={recordId} object-api-name="Provider_Review__c" layout-type="Full"
                    columns="2" mode="readonly">
                </lightning-record-form>
            </div>
        </template>
        <template lwc:else>
            <lightning-formatted-text
                value="This record has restricted access. Please contact your supervisor if access is required.">
            </lightning-formatted-text>
        </template>
    </lightning-card>


    <lightning-layout multiple-rows lwc:if={isAction}>
        <template if:true={Is_Draft}>
            <lightning-layout-item flexibility="auto" size="12"
                class="slds-p-vertical_large slds-p-horizontal_small slds-m-bottom_small slds-align_absolute-center"
                style="background:white;border-radius: 5px;">
                <lightning-button label="Delete" data-name="delete" onclick={handleButtonClick} variant="brand">
                </lightning-button>
            </lightning-layout-item>
        </template>
        <template if:true={Is_Submitted}>
            <lightning-layout-item flexibility="auto" size="12"
                class="slds-p-vertical_large slds-p-horizontal_small slds-m-bottom_small slds-align_absolute-center"
                style="background:white;border-radius: 5px;">
                <lightning-button label="View Provider Review" data-name="view" onclick={handleButtonClick}
                    variant="brand">
                </lightning-button>
            </lightning-layout-item>
        </template>
        <lightning-layout-item flexibility="auto" size="12"
            class="slds-p-vertical_large slds-p-horizontal_small slds-m-bottom_small slds-align_absolute-center"
            style="background:white;border-radius: 5px;">
            <lightning-button label="Review Provider Review" data-name="review" onclick={handleButtonClick}
                variant="brand">
            </lightning-button>
        </lightning-layout-item>
        <template if:true={Is_Submitted}>
            <template if:false={isReviewee}>
                <lightning-layout-item flexibility="auto" size="12"
                    class="slds-p-vertical_large slds-p-horizontal_small slds-m-bottom_small slds-align_absolute-center"
                    style="background:white;border-radius: 5px;">
                    <lightning-button label="Submit for State Reversal" data-name="submitForReversal"
                        onclick={handleButtonClick} variant="brand">
                    </lightning-button>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" size="12"
                    class="slds-p-vertical_large slds-p-horizontal_small slds-align_absolute-center"
                    style="background:white;border-radius: 5px;">
                    <lightning-button label="Submit to Reviewee" data-name="submitToReviewee"
                        onclick={handleButtonClick} variant="brand">
                    </lightning-button>
                </lightning-layout-item>
            </template>
        </template>
    </lightning-layout>
</template>
