<template>
    <!-- Page messages -->
    <template if:true={pageMessages}>
        <div class="slds-m-bottom_small">
            <template for:each={pageMessages} for:item="message">
                <div key={message} class={messageType}>
                    <lightning-formatted-text value={message}></lightning-formatted-text>
                </div>
            </template>
        </div>
    </template>

    <!-- Modal Container -->
    <div if:true={showDetailsModal}>
        <section class="slds-modal slds-fade-in-open" style="background: rgba(0, 0, 0, .5);">
            <template if:true={showSpinner}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
            <div class="slds-modal__container" style="max-width: 80%; width: auto;">

                <!-- Header/Title Section -->
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title slds-hyphenate">State Tax Intercept - {taxRecord.Name}</h2>
                </header>

                <!-- Details Section -->
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-p-horizontal_small">

                        <lightning-layout multiple-rows="true">

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Tax Year</span>
                                    <div class="slds-form-element__static">{taxRecord.Tax_Year__c}</div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">County</span>
                                    <div class="slds-form-element__static">{taxRecord.County__r.Name}</div>
                                </div>
                            </lightning-layout-item>

                            <template if:true={isCaseType}>
                                <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                    <div class="slds-form-element slds-form-element_readonly">
                                        <span class="slds-form-element__label">Case ID</span>
                                        <div class="slds-form-element__static">
                                            <a title="Click to open Case details"
                                                onclick={gotoCaseRecord}>{taxRecord.Case__r.Name}</a>
                                        </div>
                                    </div>
                                </lightning-layout-item>
                            </template>

                            <template if:true={isProviderType}>
                                <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                    <div class="slds-form-element slds-form-element_readonly">
                                        <span class="slds-form-element__label">Provider ID</span>
                                        <div class="slds-form-element__static">
                                            <a title="Click to open Provider details"
                                                onclick={gotoProviderRecord}>{taxRecord.Provider__r.Name}</a>
                                        </div>
                                    </div>
                                </lightning-layout-item>
                            </template>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Name</span>
                                    <div class="slds-form-element__static">{taxRecord.Name__c}</div>
                                </div>
                            </lightning-layout-item>

                            <template if:true={isCaseType}>
                                <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                    <div class="slds-form-element slds-form-element_readonly">
                                        <span class="slds-form-element__label">SSN</span>
                                        <div class="slds-form-element__static">{taxRecord.SSN__c}</div>
                                    </div>
                                </lightning-layout-item>
                            </template>

                            <template if:true={isProviderType}>
                                <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                    <div class="slds-form-element slds-form-element_readonly">
                                        <span class="slds-form-element__label">FEIN</span>
                                        <div class="slds-form-element__static">{taxRecord.FEIN__c}</div>
                                    </div>
                                </lightning-layout-item>
                            </template>

                            <template if:true={isCaseType}>
                                <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                    <div class="slds-form-element slds-form-element_readonly">
                                        <span class="slds-form-element__label">Case Status</span>
                                        <div class="slds-form-element__static">{taxRecord.Case_Status__c}</div>
                                    </div>
                                </lightning-layout-item>
                            </template>

                            <template if:true={isProviderType}>
                                <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                    <div class="slds-form-element slds-form-element_readonly">
                                        <span class="slds-form-element__label">License Status</span>
                                        <div class="slds-form-element__static">{taxRecord.License_Status__c}</div>
                                    </div>
                                </lightning-layout-item>
                            </template>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Adjustment ID</span>
                                    <div class="slds-form-element__static">
                                        <a title="Click to open Adjustment details"
                                            onclick={gotoAdjustmentRecord}>{taxRecord.Adjustment__r.Name}</a>
                                    </div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Original Recovery Amount</span>
                                    <div class="slds-form-element__static">
                                        <lightning-formatted-number value={taxRecord.Amount_Due__c}
                                            format-style="currency" currency-code="USD"></lightning-formatted-number>
                                    </div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Outstanding Recovery Balance</span>
                                    <div class="slds-form-element__static">
                                        <lightning-formatted-number value={taxRecord.Current_Balance__c}
                                            format-style="currency" currency-code="USD"></lightning-formatted-number>
                                    </div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Classification</span>
                                    <div class="slds-form-element__static">{taxRecord.Classification__c}</div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Recovery Reason</span>
                                    <div class="slds-form-element__static">{taxRecord.Recovery_Reason__c}</div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Tax Intercept ID</span>
                                    <div class="slds-form-element__static">
                                        <a title="Click to open Tax Intercept record details"
                                            onclick={gotoTaxInterceptRecord}>{taxRecord.Name}</a>
                                    </div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Last Payment Date</span>
                                    <div class="slds-form-element__static">
                                        <lightning-formatted-date-time value={taxRecord.Last_Payment_Date__c}
                                            day="numeric" month="numeric"
                                            year="numeric"></lightning-formatted-date-time>
                                    </div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Last Payment Amount</span>
                                    <div class="slds-form-element__static">
                                        <lightning-formatted-number value={taxRecord.Last_Payment_Amount__c}
                                            format-style="currency" currency-code="USD"></lightning-formatted-number>
                                    </div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="4"></lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Reinstated</span>
                                    <div class="slds-form-element__static">{taxRecord.Reinstate__c}</div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Reinstated Date</span>
                                    <div class="slds-form-element__static">
                                        <lightning-formatted-date-time value={taxRecord.Reinstate_Date__c} day="numeric"
                                            month="numeric" year="numeric"></lightning-formatted-date-time>
                                    </div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="4"></lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Removal Reason</span>
                                    <div class="slds-form-element__static">{taxRecord.Remove_Reason_Text__c}</div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Removal Date</span>
                                    <div class="slds-form-element__static">
                                        <lightning-formatted-date-time value={taxRecord.Remove_Date__c} day="numeric"
                                            month="numeric" year="numeric"></lightning-formatted-date-time>
                                    </div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" padding="around-small" size="4">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Sent to CDOR</span>
                                    <div class="slds-form-element__static">{taxRecord.Sent_to_CDOR__c}</div>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>

                        <!-- Remove field as Editable -->
                        <template if:true={showRemovalField}>
                            <lightning-layout>
                                <lightning-layout-item flexibility="auto" padding="around-small" size="6">
                                    <c-multiselect-combobox label="Removal Reason" value={removeReason}
                                        object="Tax_Intercept__c" field="Remove_Reason__c" show-none="true"
                                        onselect={handleRemoveReasonChange}>
                                    </c-multiselect-combobox>
                                </lightning-layout-item>
                            </lightning-layout>
                        </template>
                    </div>
                </div>

                <!-- Footer Section containing Buttons -->
                <footer class="slds-modal__footer">
                    <div class="slds-float_right">
                        <template if:true={removeAccess}>
                            <lightning-button variant="brand" label="Save" onclick={save}
                                class="slds-m-right_x-small"></lightning-button>
                        </template>
                        <lightning-button variant="brand-outline" label="Back" onclick={closeModal}></lightning-button>
                    </div>
                </footer>
            </div>
        </section>
    </div>
    <div if:false={showDetailsModal} class="slds-hide"></div>
</template>
