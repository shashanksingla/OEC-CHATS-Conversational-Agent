<template>
    <lightning-spinner if:true={showSpinner} alternative-text="Loading..."></lightning-spinner>
    
    <template if:true={initDataLoaded}>
        <lightning-card icon-name="standard:event">
            <div slot="title">
                <div class="slds-grid">
                    <div class="slds-col slds-has-flexi-truncate">
                        <div class="slds-media slds-no-space slds-grow">
                            <div class="slds-media__body">
                                <p class="slds-text-title--caps slds-line-height--reset">{cardTitle}</p>
                                <h1 class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate" title="Provider Fiscal Agreement">Provider Fiscal Agreement</h1>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div slot="actions">
                <c-navigation-component_lwc show-cancel={showCancelButton} show-finish={showFinishButton}
                    finish-label="Save" cancel-label="Cancel" finish-variant="brand" current-tab-number={currentTabNumber}
                    total-tabs={totalTabsValue} oncancel={handleCancel} onfinish={handleFinish}>
                </c-navigation-component_lwc>
            </div>
            <template if:true={hasPageMessages}>
                <div class="slds-m-around_medium">
                    <c-page-messages_lwc message-type={messageType} page-messages={pageMessages}></c-page-messages_lwc>
                </div>
            </template>            
            <template if:true={isCurrentTab}>
                <lightning-layout multiple-rows="true" horizontal-align="space">
                <template for:each={fieldDefinition} for:item="eachField">
                    <template if:false={eachField.isRecordTypeName}>
                        <template if:true={eachField.preSectionName}>
                            <template if:true={eachField.sectionBreakerPoint}>
                                <lightning-layout-item key={eachField.sectionBreakKey} flexibility="auto" size="6" padding="around-small"></lightning-layout-item>
                            </template>
                            <lightning-layout-item key={eachField.sectionKey} flexibility="auto" size="12" padding="around-small">
                                <h3 class="slds-section__title">{eachField.preSectionName}</h3>
                            </lightning-layout-item>
                        </template>
                        <lightning-layout-item key={eachField.fieldAPIName} flexibility="auto" size="6" padding="around-small">
                                <c-dynamic-form-generator_lwc
                                    data-field-api={eachField.fieldAPIName}
                                    field-label={eachField.fieldLabel}
                                    field-type={eachField.dataType}
                                    field-a-p-i-name={eachField.fieldAPIName}
                                    object-name={eachField.objectName}
                                    s-ob={providerFiscalAgreement}
                                    required={eachField.required}
                                    parent-object-name={eachField.referenecedObjectName}
                                    read-only={eachField.readOnly}
                                    use-plain-value={eachField.usePlainValue}
                                    field-utility-picklist-field-name={eachField.fieldUtilityPicklistFieldName}
                                    onvalidateandsetdata={handleValidateAndSetData}
                                    onsobupdate={handleSObjectUpdate}>
                                </c-dynamic-form-generator_lwc>
                                <c-field-level-message_lwc error-key={eachField.errorKey} message={eachField.errorMessage}></c-field-level-message_lwc>
                            </lightning-layout-item>
                        </template>
                    </template>
                    <lightning-layout-item flexibility="auto" size="6" padding="around-small">                   
                    </lightning-layout-item>
                </lightning-layout>
            </template>
        </lightning-card>
    </template>
</template>
