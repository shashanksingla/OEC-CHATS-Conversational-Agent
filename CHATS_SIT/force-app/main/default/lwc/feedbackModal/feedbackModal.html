<template>
    <template lwc:if={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="base"></lightning-spinner>
    </template>
    <template lwc:if={showHeader}>
        <lightning-modal-header label={header}></lightning-modal-header>
    </template>
    <lightning-modal-body>
        <lightning-card title="">
            <template if:true={feedbacks}>
                <lightning-datatable class="slds-table_col-bordered slds-table_bordered" data={normalFeedbacks}
                    columns={columns} key-field="Id" onrowselection={getSelectedName} disabled={isSupervisor}
                    hide-checkbox-column={isSupervisor}>
                </lightning-datatable>
                <template if:false={isCPFlow}>
                    <br />
                    <lightning-card title="Feedback for Rates">
                        <lightning-datatable class="slds-table_col-bordered slds-table_bordered" data={rateFeedbacks}
                            columns={rateColumns} key-field="Id" onrowselection={getSelectedName}
                            disabled={isSupervisor} hide-checkbox-column={isSupervisor}>
                        </lightning-datatable>
                    </lightning-card>
                </template>
            </template>
        </lightning-card>
    </lightning-modal-body>
    <lightning-modal-footer>
        <template for:each={buttons} for:item="button" lwc:if={buttons}>
            <lightning-button key={button.Id} data-id={button.Id} label={button.label} onclick={handleClick}
                variant={button.variant} class="slds-m-right_small"></lightning-button>
        </template> </lightning-modal-footer>
</template>
