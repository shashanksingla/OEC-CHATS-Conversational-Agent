<template>
    <template lwc:if={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="base"></lightning-spinner>
    </template>
    <div style="background:white">
        <lightning-card title="" classs="mainCard">
            <template if:true={initDone}>
                <template if:false={isvalidCompare}>
                    <h3> NO APPROVED COUNTY RATE PLAN RECORD FOUND FOR COMPARISON!! </h3>
                </template>
                <template if:true={isvalidCompare}>
                    <template if:false={isReadonly}>
                        <div slot="actions">
                            <lightning-badge label="For best results, print with landscape orientation."
                                class="slds-m-bottom_small slds-m-right_xx-small slds-float_right slds-no-print"></lightning-badge>
                            <br />
                           <lightning-button-group>
                                <lightning-button label="Return to County Rate Plan" class="slds-no-print"
                                    onclick={navigateBackToRecord}></lightning-button>
                                <lightning-button label="Save Feedback" class="slds-no-print" onclick={handleSave}
                                    variant="brand"></lightning-button>
                                <lightning-button label="Print" class="slds-no-print"
                                    onclick={handlePrint}></lightning-button>
                            </lightning-button-group>
                        </div>
                        <div slot="footer">
                            <lightning-badge label="For best results, print with landscape orientation."
                                class="slds-align_center slds-no-print"></lightning-badge>
                            <br />
                            <lightning-button-group class="slds-m-top_x-small">
                                <lightning-button label="Return to County Rate Plan" class="slds-no-print"
                                    onclick={navigateBackToRecord}></lightning-button>
                                <lightning-button label="Save Feedback" variant="brand" class="slds-no-print"
                                    onclick={handleSave}></lightning-button>
                                <lightning-button label="Print" class="slds-no-print"
                                    onclick={handlePrint}></lightning-button>

                            </lightning-button-group>
                        </div>
                    </template>
                    <template if:true={submitted_crp}>
                        <div class="slds-card__header-title slds-align_absolute-center" style="font-size:x-large">
                            <h3>Colorado Child Care Assistance Program</h3>
                        </div><br />
                        <div class="slds-align_absolute-center" style="font-size:large"> County Rate Plan - {submitted_crp.IDN_COUNTY__r.Name}
                        </div>
                        <br />
                        <div class="slds-align_absolute-center" style="font-size:medium"> Effective Begin Date : {CP_Month}</div><br />
                    </template>

                    <!-- CRP Level Questions components with all respective tables Start-->
                    <c-county-rate-plan-info_lwc compare-list={compareList} is-supervisor={isSupervisor}
                        over-all-feedback={overAllFeedback} screen-mode={screenMode}
                        has-prior-submissions={hasPriorSubmissions}>
                    </c-county-rate-plan-info_lwc>
                    <!-- CRP Level Questions components with all respective tables End-->
                    <!-- CRP Level Rate Table for Exempt Type-->
                    <template if:true={approvedExemptRatesTemp}>
                        <lightning-card title="Approved County Ceiling Rates: Provider Type (Exempt)">
                            <c-county-rate-table_lwc rates={approvedExemptRatesTemp} is-exempt is-approved
                                compare-rates={exemptRatesTemp} section-title="Exempt"
                                screen-mode={screenMode}></c-county-rate-table_lwc>
                        </lightning-card>
                    </template>
                    <template if:true={exemptRatesTemp}>
                        <lightning-card title="Submitted County Ceiling Rates: Provider Type (Exempt)">
                            <c-county-rate-table_lwc rates={exemptRatesTemp} is-exempt
                                compare-rates={approvedExemptRatesTemp} over-all-feedback={overAllFeedback}
                                section-title="Exempt" screen-mode={screenMode}></c-county-rate-table_lwc>
                        </lightning-card>
                    </template>
                    <!-- CRP Level Rate Table for Exempt Type End-->
                    <!-- CRP Level Rate Table for Home Type Start-->
                    <template if:true={approvedHomeRatesTemp}>
                        <lightning-card title="Approved County Ceiling Rates: Provider Type (Home)">
                            <c-county-rate-table_lwc rates={approvedHomeRatesTemp} is-approved
                                compare-rates={homeRatesTemp} section-title="Home"
                                screen-mode={screenMode}></c-county-rate-table_lwc>
                        </lightning-card>
                    </template>

                    <template if:true={homeRatesTemp}>
                        <lightning-card title="Submitted County Ceiling Rates: Provider Type (Home)">
                            <c-county-rate-table_lwc rates={homeRatesTemp} compare-rates={approvedHomeRatesTemp}
                                over-all-feedback={overAllFeedback} section-title="Home"
                                screen-mode={screenMode}></c-county-rate-table_lwc>
                        </lightning-card>
                    </template>
                    <!-- CRP Level Rate Table for Home Type End-->
                    <!-- CRP Level Rate Table for Center Type Start-->
                    <template if:true={approvedCenterRatesTemp}>
                        <lightning-card title="Approved County Ceiling Rates: Provider Type (Center)">
                            <c-county-rate-table_lwc rates={approvedCenterRatesTemp} is-approved
                                compare-rates={centerRatesTemp} section-title="Center"
                                screen-mode={screenMode}></c-county-rate-table_lwc>
                        </lightning-card></template>
                    <template if:true={centerRatesTemp}>
                        <lightning-card title="Submitted County Ceiling Rates: Provider Type (Center)">
                            <c-county-rate-table_lwc rates={centerRatesTemp} compare-rates={approvedCenterRatesTemp}
                                over-all-feedback={overAllFeedback} section-title="Center"
                                screen-mode={screenMode}></c-county-rate-table_lwc>
                        </lightning-card>
                    </template>
                    <!-- CRP Level Rate Table for Center Type End-->
                </template>
            </template>
        </lightning-card>
    </div>
</template>
