<template>
    <template if:true={toggleSpinner}>
        <lightning-spinner variant="brand" size="large"></lightning-spinner>
    </template>
    <template if:true={redirectCmp}>
        <lightning-card icon-name="standard:event">
            <div slot="title" class="slds-grid">
                <div class="slds-col slds-has-flexi-truncate">
                    <div class="slds-media slds-no-space slds-grow">
                        <div class="slds-media__body">
                            <h1 class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate" title="Correspondence">Printed Correspondences</h1>
                        </div>
                    </div>
                </div>
            </div>
        </lightning-card>
        <div class="slds-modal__content slds-p-around--medium">
            <lightning-layout multiple-rows horizontal-align="space">
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="12">
                    <div class="slds-float_right">
                        <lightning-button variant="brand" name="createManCorspd" label="Correspondence Print Queue" onclick={navigateScreen}
                        aria-label="Correspondence Print Queue"></lightning-button>
                    </div>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="text" pattern="[0-9]*" label="Correspondence ID" name="corspdId" value={corspdId} 
                    aria-label="Correspondence ID" onchange={handleInput} data-id="corspdId"></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <c-multiselect-combobox data-id="countyName" label="County" aria-label="County" field-name="countyName"
                        onselect={handlePickselect} behavior-type="dynamic" value={countyName} show-none 
                        picklist-type="TableFetchPicklist" method-name="getCountyCode" user-restriction="true"></c-multiselect-combobox>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="text" pattern="[0-9]*" label="Case ID" name="caseID" value={caseID} onchange={handleInput}
                    aria-label="Case ID" data-id="caseID" ></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="text" pattern="[0-9]*" label="Provider ID" name="providerId" value={providerId} onchange={handleInput}
                    aria-label="Provider ID" data-id="providerId"></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <c-multiselect-combobox label="Correspondence Recipient Type" object="T_DOC_RQ__c" field="CDE_TYPE_RCPT__c" 
                        onselect={handlePickselect} behavior-type="dynamic" picklist-type="GlobalPicklist" value={corspdRcptType} 
                        multi-select="false" show-none field-name="corspdRcptType" data-id="corspdRcptType"
                        aria-label="Correspondence Recipient Type"></c-multiselect-combobox>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <c-multiselect-combobox label="Correspondence Type" aria-label="Correspondence Type"  
                        method-name="getAllCorrespondences" onselect={handlePickselect} value={corspdName} 
                        multi-select="false" show-none field-name="corspdName" data-id="corspdName"
                        behavior-type="dynamic" picklist-type="TableFetchPicklist"></c-multiselect-combobox>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <c-custom-lookup_lwc label="User Requested" object-api-name="User" search-field="Name"
                    onvalueselected={handleLookupValue} value={userInfoId} data-id="userInfoId"
                    aria-label="User Requested"></c-custom-lookup_lwc>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" size="6" class="slds-p-vertical_x-small slds-p-horizontal_small">
                    <c-multiselect-combobox label="Suppressed Indicator" behavior-type="dynamic" picklist-type="GlobalPicklist"
                    value={suppressIndicator} object="T_DOC_RQ__c" field="Suppressed_Indicator__c" show-none onselect={handlePickselect}
                    field-name="suppressIndicator" data-id="suppressIndicator" aria-label="Suppressed Indicator"></c-multiselect-combobox>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_x-small slds-p-horizontal_small">
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_x-small slds-p-horizontal_small">
                    <h3 class="slds-section__title">Correspondence Date Ranges</h3>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="date" data-id="beginDate" label="Date Requested Begin Date" value={beginDate} date-style="short" 
                    aria-label="Date Requested Begin Date" onchange={handleInput}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="date" data-id="endDate" label="Date Requested End Date" value={endDate} date-style="short" 
                    aria-label="Date Requested End Date" onchange={handleInput}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="date" data-id="printedBeginDate" label="Date Printed Begin Date" value={printedBeginDate} date-style="short" 
                    aria-label="Date Printed Begin Date" onchange={handleInput}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="date" data-id="printedEndDate" label="Date Printed End Date" value={printedEndDate} date-style="short" 
                    aria-label="Date Printed End Date" onchange={handleInput}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_x-small slds-p-horizontal_small">
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="12">
                    <div class="slds-float_right">
                        <lightning-button variant="brand" name="Search" label="Search" onclick={corspdSearch} 
                        aria-label="Search" ></lightning-button>
                    </div>
                </lightning-layout-item>
            </lightning-layout>
        </div>
        <br/>
        <template if:true={hasSearchResults}>
            <article class="slds-card" style="padding: 0.3rem 0rem 0.3rem 0rem; display: flex; justify-content: center; position: relative;">
                <div>
                    <h2 class="slds-section__title slds-text-heading--medium" style="justify-content: center;">Search Results</h2>
                    <h5 class="slds-section__title slds-text-color_weak" style="justify-content: center; font-size: 0.9rem;">Displaying {totalNumberOfRecordsDisplaying} out of {totalNumberOfRecordsFound} results</h5>
                </div>
                <div style="position: absolute; right: 1rem; top: 1.2rem;">
                    <lightning-button-group>
                        <lightning-button variant="brand" name="Delete" label="Delete" onclick={deleteCorspd}
                        aria-label="Delete"></lightning-button>
                        <span>&nbsp;</span>
                        <lightning-button variant="brand" name="suppressed" label="Suppress" onclick={suppressClicked}
                        aria-label="Suppress" ></lightning-button>
                        <span>&nbsp;</span>
                        <lightning-button variant="brand" name="UnSuppressed" label="Unsuppress" onclick={unSuppressClicked}
                        aria-label="Unsuppress"></lightning-button>
                    </lightning-button-group>
                </div>
            </article>  
            <div style="max-height: auto;">
                <lightning-datatable key-field="corrID" data={recordsToDisplay} columns={columns} selected-rows={selectedRows} onrowselection={handleRowSelection}
                    resize-column-disabled onsort={handleSort} onrowaction={viewPrintedCorspd} aria-label="Printed Correspondence View Table"
                    sorted-by={sortedField} sorted-direction={sortDirection} default-sort-direction={defaultSortDirection}>
                </lightning-datatable>
            </div>                      
            <div class="slds-modal__footer slds-align_right slds-card">
                <div class="slds-grid">
                    <template if:false={isReadOnlyProfile}>
                        <div class="slds-align_absolute-left">
                            <lightning-button variant="brand" name="Delete" label="Delete" onclick={deleteCorspd}
                            aria-label="Delete"></lightning-button>
                        </div>
                    </template>
                    <div class="slds-m-left_small"></div>
                    <div class="slds-align_absolute-left">
                        <lightning-button variant="brand" name="suppressed" label="Suppress" onclick={suppressClicked}
                        aria-label="Suppress"></lightning-button>
                    </div>
                    <div class="slds-m-left_small"></div>
                    <div class="slds-align_absolute-left">
                        <lightning-button variant="brand" name="UnSuppressed" label="Unsuppress" onclick={unSuppressClicked}
                        aria-label="Unsuppress"></lightning-button>
                    </div>

                    <div class="slds-align_absolute-center">
                        <template if:true={hasMorePages}>
                            <div class="slds-align_absolute-center">
                                <div class="slds-button-group" role="group">
                                    <button class="slds-button slds-button_neutral" onclick={clickPrevious}>Previous</button>
                                    <div class="slds-align_absolute-center slds-p-left_x-small slds-p-right_x-small slds-text-body_regular">Page {currentPageNo} of {numberOfPages}</div>
                                    <button class="slds-button slds-button_neutral" onclick={clickNext}>Next</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </template>
    <template if:true={confirmationModal}>
        <c-confirmation-modal_-l-w-c confirm-msg="Are you sure you want to delete the selected Correspondence?" onyes={confirmDelete} onno={closeModal}></c-confirmation-modal_-l-w-c>
    </template>
    <template if:true={confirmationModalSupressed}>
        <c-confirmation-modal_-l-w-c confirm-msg={supressedUnSuppressedMessage} onyes={confirmSuppress} onno={closeModal}></c-confirmation-modal_-l-w-c>
    </template>
    <template if:true={confirmationModalUnSuppressed}>
        <c-confirmation-modal_-l-w-c confirm-msg={supressedUnSuppressedMessage} onyes={confirmUnsuppress} onno={closeModal}></c-confirmation-modal_-l-w-c>
    </template>
</template>
