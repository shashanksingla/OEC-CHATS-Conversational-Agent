<template>
    <template if:false={hideLabel}>
        <div>
            <lightning-formatted-text value={label} class="slds-form-element__label slds-no-flex"></lightning-formatted-text>
        </div>
    </template>
    <div>
        <template if:true={isUIDate}>
            <lightning-formatted-date-time value={value} year="numeric" month="2-digit" day="2-digit"></lightning-formatted-date-time>
        </template>
        <template if:true={usePlainValue}>
            <lightning-formatted-text value={value}></lightning-formatted-text>
        </template>
        <template if:false={usePlainValue}>
            <template if:true={isDate}>
                <template if:true={convertTime}>
                    <lightning-formatted-text value={updatedValue}></lightning-formatted-text>
                </template>
                <template if:false={convertTime}>
                    <lightning-formatted-date-time value={value} year="numeric" month="numeric" day="numeric"></lightning-formatted-date-time>
                </template>
            </template>
            <template if:true={isNoneOrStringOrEmailOrPhone}>
                <lightning-formatted-text value={value}></lightning-formatted-text>
            </template>
            <template if:true={isDecimalOrDouble}>
                <lightning-formatted-text value={updatedValue}></lightning-formatted-text>
            </template>
            <template if:true={isCurrency}>
                <lightning-formatted-number value={value} format-style="currency" currency-code={currencyCode}></lightning-formatted-number>
            </template>
        </template>
    </div>
</template>
