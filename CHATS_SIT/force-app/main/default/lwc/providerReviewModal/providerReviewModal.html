<template>
    <template if:true={showHeader}>
        <lightning-modal-header label={modalHeader}></lightning-modal-header>
    </template>
    <lightning-modal-body>
        <template lwc:if={lwcToImport}>
            <template lwc:if={showModal}>
                <div class="container">
                    <template lwc:if={stateReviewee}>
                        <lightning-textarea name="taskComment" label="Comment" value={taskComment} required
                            onchange={handleUpdate} max-length="2000"></lightning-textarea>
                    </template>
                    <template lwc:if={submitToReviewee}>
                        <div class="slds-col slds-size_1-of-1 slds-var-p-around_medium" style="height:10rem;">
                            <c-custom-lookup_lwc label="Reviewee" class="revieweeLookup" object-label="User" object-api-name="User"
                                onvalueselected={handleValueSelectedOnAccount} required>
                            </c-custom-lookup_lwc>
                        </div>
                    </template>
                </div>
            </template>
        </template>
        <template lwc:else>
            {modalContent}
        </template>
    </lightning-modal-body>
    <lightning-modal-footer>
        <template for:each={buttons} for:item="button" lwc:if={buttons}>
            <lightning-button key={button.Id} data-id={button.Id} label={button.label} onclick={handleClick}
                variant={button.variant} class="slds-m-right_small"></lightning-button>
        </template> </lightning-modal-footer>

</template>
