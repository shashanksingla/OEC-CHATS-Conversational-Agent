<template>
    <!--
    **************************************      EDIT/NEW MODE  START         **************************************
    -->
    <template if:false={isViewMode}>
        <lightning-layout multiple-rows>
            <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="12">
                <div style="font-size: 1rem; padding-bottom: 0.2rem;">
                    Element #{elementNumber}: {internalWrapper.questionRec.Element__c}
                                <span style="vertical-align: bottom; padding-left: 0.4rem;">
                        <lightning-helptext
                            content={internalWrapper.questionRec.Review_Requirement__c}></lightning-helptext>
                    </span>
                </div>
                <!--ProviderReview_QuestionMain__c-->
                <c-multiselect-combobox label={internalWrapper.questionRec.Question__c} data-id="input-field"
                    value={internalWrapper.responseRec.ProviderReview_QuestionMain__c} disabled={isReviewee}
                    object="Provider_Review_Response__c" label-bold="true" field="ProviderReview_QuestionMain__c"
                    required show-none already-has-values options={internalWrapper.elementQuestionOptions}
                    behavior-type="picklist" onselect={handlePickselect}></c-multiselect-combobox>
            </lightning-layout-item>
            <!--showing Errors and Causes-->
            <template if:false={hideErrorsAndCauses}>
                <!--If ProviderReview_QuestionMain__c = NA-->
                <template if:true={isNAMainQuestion}>
                    <lightning-layout-item flexibility="auto" size="12"
                        class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                        <c-multiselect-combobox label="If N/A, Reason:" data-id="input-field"
                            value={internalWrapper.responseRec.ProviderReview_NA_Reason__c}
                            object="Provider_Review_Response__c" field="ProviderReview_NA_Reason__c" show-none
                            required="true" disabled={isNA_Disabled} behavior-type="picklist"
                            onselect={handlePickselect}></c-multiselect-combobox>
                    </lightning-layout-item>
                </template>
                <!--If ProviderReview_QuestionMain__c = NO-->
                <template if:true={isNoMainQuestion}>
                    <!--showing Element_Apply_to_Case__c-->
                    <template if:true={showElementApplyToCase}>
                        <lightning-layout-item flexibility="auto" size="12"
                            class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                            <c-multiselect-combobox label="Does this Element Apply to the case?" data-id="input-field"
                                value={internalWrapper.responseRec.Element_Apply_to_Case__c} show-none
                                object="Provider_Review_Response__c" field="Element_Apply_to_Case__c" disabled
                                behavior-type="picklist"></c-multiselect-combobox>
                        </lightning-layout-item>
                    </template>
                    <!--showing Causes_Payment_Error__c-->
                    <lightning-layout-item flexibility="auto" size="12"
                        class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                        <c-multiselect-combobox label="Did this cause a payment error?" data-id="input-field"
                            value={internalWrapper.responseRec.Causes_Payment_Error__c}
                            object="Provider_Review_Response__c" field="Causes_Payment_Error__c" show-none
                            required="true" disabled={isReviewee} behavior-type="picklist"
                            onselect={handlePickselect}></c-multiselect-combobox>
                    </lightning-layout-item>



                    <!-- List of Errors and Causes relevant to Main Question
                        Start-->
                    <template for:each={ErrorNCauses} for:item="row" lwc:if={allErrorOptions}>
                        <!-- Review Error -->
                        <lightning-layout-item flexibility="auto" size="6" key={row.Id}
                            class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                            <c-multiselect-combobox label={row.errorLabel} class={row.errorField} data-id="input-field"
                                value={row.errorValue} object="Provider_Review_Response__c" field={row.errorField}
                                show-none already-has-values options={row.errorOptions} behavior-type="picklist"
                                disabled={row.errorDisabled} required={row.errorRequired}
                                onselect={handlePickselect}></c-multiselect-combobox>
                        </lightning-layout-item>
                        <!-- Review Error Cause -->
                        <lightning-layout-item flexibility="auto" size="6" key={row.Id}
                            class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                            <c-multiselect-combobox label="Cause" class={row.causeField} value={row.causeValue}
                                data-id="input-field" show-none object="Provider_Review_Response__c"
                                field={row.causeField} already-has-values options={row.causeOptions}
                                disabled={row.causeDisabled} required={row.causeRequired} behavior-type="picklist"
                                onselect={handlePickselect}></c-multiselect-combobox>
                        </lightning-layout-item>
                    </template>
                    <!-- List of Errors and Causes relevant to Main Question
                        END-->
                </template>
            </template>
            <!--Observation_Details_Comments__c-->
            <lightning-layout-item flexibility="auto" size="12"
                class="slds-p-vertical_xx-small slds-p-horizontal_small">
                <lightning-textarea data-id="input-field" data-name="Observation_Details_Comments__c"
                    label="Observation Details &amp; Comments (required for elements)"
                    value={internalWrapper.responseRec.Observation_Details_Comments__c} disabled={isReviewee}
                    onchange={handleCompSelect} max-length="2000"></lightning-textarea>
            </lightning-layout-item>
            <!--Action_Required__c-->
            <lightning-layout-item flexibility="auto" size="12"
                class="slds-p-vertical_xx-small slds-p-horizontal_small">
                <c-multiselect-combobox
                    label="Is action required to correct the provider file before the next fiscal renewal date?"
                    data-id="input-field" value={internalWrapper.responseRec.Action_Required__c} disabled={isReviewee}
                    object="Provider_Review_Response__c" field="Action_Required__c" show-none behavior-type="picklist"
                    onselect={handlePickselect}></c-multiselect-combobox>
            </lightning-layout-item>
            <!--Showing Action Required Sub Questions-->
            <template if:true={showActionRequired}>
                <!--Action_Taken__c-->
                <lightning-layout-item flexibility="auto" size="12"
                    class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                    <lightning-textarea data-name="Action_Taken__c" label="Actions Taken" data-id="input-field"
                        value={internalWrapper.responseRec.Action_Taken__c} required={isActionRequiredAndReviewee}
                        onchange={handleCompSelect} disabled={actionDisabled} max-length="2000"></lightning-textarea>
                </lightning-layout-item>
                <!--Action_Date__c-->
                <lightning-layout-item flexibility="auto" size="12"
                    class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                    <lightning-input type="date" data-id="input-field" data-name="Action_Date__c"
                        label="Date of Action Taken" value={actionDateValue} required={isActionRequiredAndReviewee}
                        onchange={handleCompSelect} disabled={actionDisabled} class="dateCmp"></lightning-input>
                </lightning-layout-item>
            </template>
            <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_x-small"></lightning-layout-item>
        </lightning-layout>
    </template>
    <!--
    **************************************      EDIT/NEW MODE  END         **************************************
    -->
    <!--
    **************************************      View MODE  START           **************************************
    -->
    <template if:true={isViewMode}>
        <hr style="margin: 0; border: 0; height: 1px; background: gray; opacity: 40%;">
        <!--ProviderReview_QuestionMain__c-->
        <lightning-layout multiple-rows>


            <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="12">
                <div style="font-size: 1rem; padding-bottom: 0.2rem;">
                    Element #{elementNumber}: {internalWrapper.questionRec.Element__c}
                </div>
                <span class="slds-form-element__label">{internalWrapper.questionRec.Question__c}</span>
                <div class="slds-form-element__static">{internalWrapper.responseRec.ProviderReview_QuestionMain__c}
                </div>
            </lightning-layout-item>
            <!--If Hide_Errors_and_Causes__c = true-->
            <template if:false={hideErrorsAndCauses}>
                <!--If ProviderReview_QuestionMain__c = NA-->
                <template if:true={isNAMainQuestion}>
                    <lightning-layout-item flexibility="auto" size="12" class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                        <span class="slds-form-element__label">If N/A, Reason:</span>
                        <div class="slds-form-element__static">
                            {internalWrapper.responseRec.ProviderReview_NA_Reason__c}
                        </div>
                    </lightning-layout-item>
                </template>
                <!--If ProviderReview_QuestionMain__c = NO-->
                <template if:true={isNoMainQuestion}>
                    <!-- showing Element_Apply_to_Case__c -->
                    <template if:true={showElementApplyToCase}>
                        <lightning-layout-item flexibility="auto" size="12"
                            class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                            <span class="slds-form-element__label">Does this Element Apply to the case?</span>
                            <div class="slds-form-element__static">
                                {internalWrapper.responseRec.Element_Apply_to_Case__c}
                            </div>
                        </lightning-layout-item>
                    </template>

                    <!-- Causes_Payment_Error__c -->
                    <lightning-layout-item flexibility="auto" size="12"
                        class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                        <span class="slds-form-element__label"> Did this cause a payment error?</span>
                        <div class="slds-form-element__static">{internalWrapper.responseRec.Causes_Payment_Error__c}
                        </div>
                    </lightning-layout-item>

                    <!-- List of Errors and Causes relevant to Main Question
                        Start-->
                    <template for:each={ErrorNCauses} for:item="row" lwc:if={allErrorOptions}>
                        <lightning-layout-item flexibility="auto" size="12" key={row.Id}
                            class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                            <table key={row.Id}>
                                <template if:true={row.errorValue}>
                                    <tr>
                                        <!-- Review Error -->
                                        <td style="width: 50%;">
                                            <span class="slds-form-element__label">{row.errorLabel}</span>
                                            <div class="slds-form-element__static">
                                                {row.errorValue}
                                            </div>
                                        </td>
                                        <!-- Review Error Cause -->
                                        <td style="width: 50%;">
                                            <span class="slds-form-element__label">Cause:</span>
                                            <div class="slds-form-element__static">
                                                {row.causeValue}
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </table>
                        </lightning-layout-item>
                    </template>
                    <!-- List of Errors and Causes relevant to Main Question
                        END-->
                </template>
            </template>
            <!--Observation_Details_Comments__c-->
            <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_x-small slds-p-horizontal_small">
                <span class="slds-form-element__label">Observation Details &amp; Comments (required for elements)</span>
                <div class="slds-form-element__static">{internalWrapper.responseRec.Observation_Details_Comments__c}
                </div>
            </lightning-layout-item>
            <!--Action_Required__c-->
            <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_x-small slds-p-horizontal_small">
                <span class="slds-form-element__label">Is action required to correct the provider file before the next
                    fiscal renewal date?</span>
                <div class="slds-form-element__static">{internalWrapper.responseRec.Action_Required__c}</div>
            </lightning-layout-item>
            <!--Showing Action Taken Sub Questions-->
            <template if:true={showActionRequired}>
                <!--Action_Taken__c-->
                <lightning-layout-item flexibility="auto" size="12"
                    class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                    <span class="slds-form-element__label">Actions Taken</span>
                    <div class="slds-form-element__static">{internalWrapper.responseRec.Action_Taken__c}</div>
                </lightning-layout-item>
                <!--Action_Date__c-->
                <lightning-layout-item flexibility="auto" size="12"
                    class='slds-p-vertical_xx-small slds-p-horizontal_small'>
                    <span class="slds-form-element__label">Date of Action Taken</span>
                    <div class="slds-form-element__static">
                        <lightning-formatted-date-time value={internalWrapper.responseRec.Action_Date__c} day="numeric"
                            month="numeric" year="numeric" time-zone="UTC"></lightning-formatted-date-time>
                    </div>
                </lightning-layout-item>
            </template>
        </lightning-layout>
    </template>

    <!--
    **************************************      View MODE  END         **************************************
    -->
</template>
