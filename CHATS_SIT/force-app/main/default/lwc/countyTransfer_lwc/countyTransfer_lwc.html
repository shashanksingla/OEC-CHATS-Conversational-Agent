<template>

    <!-- Spinner -->
    <template lwc:if={isSpinnerVisible}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>

    <!-- Page-level error message -->
    <template lwc:if={pageError}>
        <div class="slds-m-top_small">
            <c-field-level-message_lwc message={pageError}></c-field-level-message_lwc>
        </div>
    </template>

    <div class="slds-p-around_medium">
        <div class="slds-form transfer-form-row" role="list">

            <!-- Left column: County + Assignee -->
            <div class="slds-form__item transfer-col-left" role="listitem">

                <!-- County (required) -->
                <div class="slds-form-element">
                    <c-custom-lookup_lwc
                        data-id="input-field"
                        label="County"
                        unique-key="countyId"
                        object-api-name="T_COUNTY__c"
                        placeholder="search.."
                        required
                        filter="CDE_COUNTY__c != 66"
                        selected-record-id={selectedCountyId}
                        onvalueselected={handleLookupValue}>
                    </c-custom-lookup_lwc>
                </div>

                <!-- Assignee (not required) -->
                <div class="slds-form-element slds-m-top_medium">
                    <c-custom-lookup_lwc
                        data-id="input-field"
                        label="Assignee"
                        unique-key="assigneeId"
                        object-api-name="User"
                        placeholder="search.."
                        filter={assigneeFilter}
                        selected-record-id={selectedAssigneeId}
                        onvalueselected={handleLookupValue}>
                    </c-custom-lookup_lwc>
                </div>

            </div>
            <!-- /Left column -->

            <!-- Right column: County Transfer Notes -->
            <div class="slds-form__item transfer-col-right" role="listitem">
                <lightning-textarea
                    data-id="input-field"
                    label="County Transfer Notes"
                    required
                    max-length="5000"
                    value={notes}
                    onchange={handleNotesChange}>
                </lightning-textarea>
            </div>
            <!-- /Right column -->

        </div>

        <!-- Footer buttons -->
        <div class="slds-m-top_medium slds-text-align_center">
            <lightning-button
                variant="brand"
                label="Save"
                onclick={handleSave}
                disabled={isSaving}
                class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button
                variant="neutral"
                label="Cancel"
                onclick={handleCancel}>
            </lightning-button>
        </div>

    </div>

</template>
