<template>
    <template if:true={toggleSpinner}>
        <lightning-spinner variant="brand" size="large"></lightning-spinner>
    </template>
    <template if:true={isOpen}>
        <lightning-card icon-name="standard:event">
            <div slot="title" class="slds-grid">
                <div class="slds-col slds-has-flexi-truncate">
                    <div class="slds-media slds-no-space slds-grow">
                        <div class="slds-media__body">
                            <h1 class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate" title="Correspondence">Correspondence Print Queue</h1>
                        </div>
                    </div>
                </div>
            </div>
        </lightning-card>
        <div class="slds-modal__content slds-p-around--medium">
            <lightning-layout multiple-rows horizontal-align="space">
                <template if:false={isReadOnlyProfile}>
                    <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="12">
                        <div class="slds-float_right">
                            <lightning-button variant="brand" name="createManCorspd" label="Create Manual Correspondence" onclick={createCorspdMan}
                            aria-label="Create Manual Correspondence"></lightning-button>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="12">
                        <div class="slds-float_right">
                            <lightning-button variant="brand" name="printedCorspdView" label="Printed Correspondence View" onclick={navigateScreen}
                            aria-label="Printed Correspondence View"></lightning-button>
                        </div>
                    </lightning-layout-item>
                </template>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="text" pattern="[0-9]*" data-id="corspdId" label="Correspondence ID" name="correspondenceId" value={corspdId} 
                    aria-label="Correspondence ID" onchange={handleInput}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <c-multiselect-combobox data-id="corspdStatus" label="Correspondence Status" object="T_DOC_RQ__c" field="CDE_CORSPD_STATUS__c" 
                        options={statusOptions} onselect={handlePickselect} behavior-type="picklist" value={corspdStatus} 
                        field-name="corspdStatus" already-has-values show-none aria-label="Correspondence Status"></c-multiselect-combobox>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <c-multiselect-combobox data-id="countyName" label="County" picklist-type="TableFetchPicklist" method-name="getCountyCode" user-restriction="true"
                        onselect={handlePickselect} behavior-type="dynamic" value={countyName} field-name="countyName" show-none aria-label="County"></c-multiselect-combobox>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <c-multiselect-combobox data-id="corspdName" label="Correspondence Type" behavior-type="dynamic" picklist-type="TableFetchPicklist" 
                        method-name="getAllCorrespondences" onselect={handlePickselect} value={corspdName} 
                        field-name="corspdName" show-none aria-label="Correspondence Type"></c-multiselect-combobox>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="text" pattern="[0-9]*" data-id="caseID" label="Case ID" name="caseID" value={caseID} 
                    onchange={handleInput} aria-label="Case ID"></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="text" pattern="[0-9]*" data-id="providerId" label="Provider ID" name="providerId" value={providerId} 
                    aria-label="Provider ID" onchange={handleInput}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="date" data-id="beginDate" label="Date Requested Begin Date" value={beginDate} date-style="short" 
                    aria-label="Date Requested Begin Date" onchange={handleInput}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <lightning-input type="date" data-id="endDate" label="Date Requested End Date" value={endDate} date-style="short" 
                    aria-label="Date Requested End Date" onchange={handleInput}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <c-multiselect-combobox data-id="corspdRcptType" label="Correspondence Recipient Type" object="T_DOC_RQ__c" field="CDE_TYPE_RCPT__c" 
                        onselect={handlePickselect} behavior-type="dynamic" picklist-type="GlobalPicklist" value={corspdRcptType} 
                        show-none field-name="corspdRcptType" aria-label="Correspondence Recipient Type"></c-multiselect-combobox>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="6">
                    <c-custom-lookup_lwc label="User Requested" object-api-name="User" search-field="Name"
                    onvalueselected={handleLookupValue} value={userInfoId} data-id="userInfoId" aria-label="User Requested"></c-custom-lookup_lwc>
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" size="12" class="slds-p-vertical_x-small slds-p-horizontal_small">
                </lightning-layout-item>
                <lightning-layout-item flexibility="auto" class="slds-p-vertical_x-small slds-p-horizontal_small" size="12">
                    <div class="slds-float_right">
                        <lightning-button variant="brand" name="Search" label="Search" onclick={corspdSearch} aria-label="Search"></lightning-button>
                    </div>
                </lightning-layout-item>
            </lightning-layout>
        </div>
        <br />
        <template if:true={hasSearchResults}>
            <article class="slds-card" style="padding: 0.3rem 0rem 0.3rem 0rem;">
                <h2 class="slds-section__title slds-text-heading--medium" style="justify-content: center;">Search Results</h2>
                <h5 class="slds-section__title slds-text-color_weak" style="justify-content: center; font-size: 0.9rem;">Displaying {totalNumberOfRecordsDisplaying} out of {totalNumberOfRecordsFound} results</h5>
            </article>
            <div class="slds-col slds-size_1-of-1 slds-border_top">
                <lightning-datatable key-field="corrID" data={recordsToDisplay} columns={columns} onrowaction={navigateToCorr} 
                resize-column-disabled onsort={handleSort} aria-label="Correspondence Print Queue Results" selected-rows={selectedRows}
                sorted-by={sortedField} sorted-direction={sortDirection} default-sort-direction={defaultSortDirection}>
            </lightning-datatable>
            </div>
            <div class="slds-modal__footer slds-align_right slds-card">
                <div class="slds-grid">
                    <div class="slds-align_absolute-center">
                        <template if:true={hasMorePages}>
                            <div class="slds-align_absolute-center">
                                <div class="slds-button-group" role="group">
                                    <button class="slds-button slds-button_neutral" onclick={clickPrevious}>Previous</button>
                                    <div class="slds-align_absolute-center slds-p-left_x-small slds-p-right_x-small slds-text-body_regular">Page {currentPageNo} of {numberOfPages}</div>
                                    <button class="slds-button slds-button_neutral" onclick={clickNext}>Next</button>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="slds-align_absolute-right">
                        <lightning-button variant="brand" name="Print" label="Print" onclick={printCorspd} aria-label="Print"></lightning-button>
                    </div>
                </div>
            </div>
        </template>
    </template>
    <template if:true={openManCorspd}>
        <c-man-corspd-l-w-c child-attr={openManCorspd} oncancel={closeModal}></c-man-corspd-l-w-c>
    </template>
</template>
