<template>
    <!-- Delete Confirmation Modal -->
    <template if:true={showDeleteModal}>
        <c-confirmation-modal_-l-w-c confirm-msg={deleteConfirmMessage} onyes={handleDeleteConfirm}
            onno={handleDeleteCancel}>
        </c-confirmation-modal_-l-w-c>
    </template>

    <tr role="row" aria-rowindex={rowIndex}>
        <!-- Case Name Column: shown when adjustment.IDN_PROVR__c is set -->
        <template if:true={showCaseColumn}>
            <td role="gridcell" aria-colindex="1" class="row-cell" data-label="Case Name">
                <div class="cell-header" aria-hidden="true">Case Name</div>
                <div class="cell-content" aria-label="Case Name">
                    {caseNameDisplay}</div>
            </td>
        </template>

        <!-- Provider Name Column: shown when adjustment.IDN_CASE__c is set -->
        <template if:true={showProviderColumns}>
            <td role="gridcell" aria-colindex={providerNameColIndex} class="row-cell" data-label="Provider Name">
                <div class="cell-header" aria-hidden="true">Provider Name</div>
                <div class="cell-content" aria-label="Provider Name">
                    {providerNameDisplay}</div>
            </td>
        </template>

        <!-- Facility Name Column: shown when adjustment.IDN_CASE__c is set -->
        <template if:true={showProviderColumns}>
            <td role="gridcell" aria-colindex={facilityNameColIndex} class="row-cell" data-label="Facility Name">
                <div class="cell-header" aria-hidden="true">Facility Name</div>
                <div class="cell-content" aria-label="Facility Name">
                    {facilityNameDisplay}</div>
            </td>
        </template>

        <!-- Child First Name -->
        <td role="gridcell" aria-colindex={childFirstNameColIndex} class="row-cell" data-label="Child First Name">
            <div class="cell-header" aria-hidden="true">Child First Name</div>
            <div class="cell-content" aria-label="Child First Name">
                {childFirstNameDisplay}</div>
        </td>

        <!-- Child Last Name -->
        <td role="gridcell" aria-colindex={childLastNameColIndex} class="row-cell" data-label="Child Last Name">
            <div class="cell-header" aria-hidden="true">Child Last Name</div>
            <div class="cell-content" aria-label="Child Last Name">
                {childLastNameDisplay}</div>
        </td>

        <!-- Care Date -->
        <td role="gridcell" aria-colindex={careDateColIndex} class="row-cell" data-label="Care Date">
            <div class="cell-header" aria-hidden="true">Care Date</div>
            <div class="cell-content" aria-label="Care Date">{adjustmentDtlWarp.subPaymentDetails.dte_care__c}</div>
        </td>

        <!-- Unit Care Expected -->
        <td role="gridcell" aria-colindex={unitCareExpectedColIndex} class="row-cell" data-label="Unit Care Expected">
            <div class="cell-header" aria-hidden="true">Unit Care Expected</div>
            <div class="cell-content" aria-label="Unit Care Expected">
                {adjustmentDtlWarp.subPaymentDetails.cde_unit_care_exptd__c}</div>
        </td>

        <!-- Unit Type -->
        <td role="gridcell" aria-colindex={unitTypeColIndex} class="row-cell" data-label="Unit Type">
            <div class="cell-header" aria-hidden="true">Unit Type</div>
            <div class="cell-content" aria-label="Unit Type">{adjustmentDtlWarp.subPaymentDetails.cde_type_unit_care__c}
            </div>
        </td>

        <!-- Unit Care Actual -->
        <td role="gridcell" aria-colindex={unitCareActualColIndex} class="row-cell" data-label="Unit Care Actual">
            <div class="cell-header" aria-hidden="true">Unit Care Actual</div>
            <div class="cell-content" aria-label="Unit Care Actual">
                {adjustmentDtlWarp.subPaymentDetails.cde_unit_care_actual__c}</div>
        </td>

        <!-- Time Traditional -->
        <td role="gridcell" aria-colindex={timeTraditionalColIndex} class="row-cell" data-label="Time Traditional">
            <div class="cell-header" aria-hidden="true">Time Traditional</div>
            <div class="cell-content" aria-label="Time Traditional">
                {adjustmentDtlWarp.subPaymentDetails.cde_time_trdnl__c}</div>
        </td>

        <!-- Rate Amount -->
        <td role="gridcell" aria-colindex={rateAmountColIndex} class="row-cell currency-cell" data-label="Rate Amount">
            <div class="cell-header" aria-hidden="true">Rate Amount</div>
            <div class="cell-content" aria-label="Rate Amount">{adjustmentDtlWarp.subPaymentDetails.amt_rate__c}</div>
        </td>

        <!-- Copay Amount -->
        <td role="gridcell" aria-colindex={copayAmountColIndex} class="row-cell currency-cell"
            data-label="Copay Amount">
            <div class="cell-header" aria-hidden="true">Copay Amount</div>
            <div class="cell-content" aria-label="Copay Amount">{adjustmentDtlWarp.subPaymentDetails.amt_copay__c}</div>
        </td>

        <!-- Total Amount -->
        <td role="gridcell" aria-colindex={totalAmountColIndex} class="row-cell currency-cell"
            data-label="Total Amount">
            <div class="cell-header" aria-hidden="true">Total Amount</div>
            <div class="cell-content" aria-label="Total Amount">{adjustmentDtlWarp.subPaymentDetails.amt_total__c}</div>
        </td>

        <!-- Authorized Hours Adjusted -->
        <td role="gridcell" aria-colindex={authHoursAdjustedColIndex} class="row-cell"
            data-label="Authorized Hours Adjusted">
            <div class="cell-header" aria-hidden="true">Auth Hours Adj</div>
            <div class="cell-content" aria-label="Authorized Hours Adjusted">
                {adjustmentDtlWarp.ajustmentDetails.NBR_HOURS_AUTH_ADJD__c}</div>
        </td>

        <!-- Attended Hours Adjusted -->
        <td role="gridcell" aria-colindex={attendedHoursAdjustedColIndex} class="row-cell"
            data-label="Attended Hours Adjusted">
            <div class="cell-header" aria-hidden="true">Attended Hours Adj</div>
            <div class="cell-content" aria-label="Attended Hours Adjusted">
                {adjustmentDtlWarp.ajustmentDetails.NBR_HOURS_ATTND_ADJD__c}</div>
        </td>

        <!-- Rate Type Adjusted -->
        <td role="gridcell" aria-colindex={rateTypeAdjustedColIndex} class="row-cell" data-label="Rate Type Adjusted">
            <div class="cell-header" aria-hidden="true">Rate Type Adj</div>
            <div class="cell-content" aria-label="Rate Type Adjusted">
                {adjustmentDtlWarp.ajustmentDetails.CDE_TYPE_RATE_ADJD__c}</div>
        </td>

        <!-- Rate Paid Adjusted -->
        <td role="gridcell" aria-colindex={ratePaidAdjustedColIndex} class="row-cell currency-cell"
            data-label="Rate Paid Adjusted">
            <div class="cell-header" aria-hidden="true">Rate Paid Adj</div>
            <div class="cell-content">
                <lightning-formatted-number value={adjustmentDtlWarp.ajustmentDetails.AMT_PAID_RATE_ADJD__c}
                    format-style="currency" currency-code="USD" aria-label="Rate Paid Adjusted amount in USD">
                </lightning-formatted-number>
            </div>
        </td>

        <!-- Adjusted Amount: negative if Recovery and non-zero, otherwise as-is -->
        <td role="gridcell" aria-colindex={adjustedAmountColIndex} class="row-cell currency-cell"
            data-label="Adjusted Amount">
            <div class="cell-header" aria-hidden="true">Adjusted Amount</div>
            <div class="cell-content">
                <lightning-formatted-number value={adjustedAmountDisplay} format-style="currency" currency-code="USD"
                    aria-label="Adjusted Amount value in USD">
                </lightning-formatted-number>
            </div>
        </td>

        <!-- Action Menu: shown only in view/edit mode -->
        <template if:true={showActionMenu}>
            <td role="gridcell" aria-colindex={actionColIndex} class="row-cell action-cell" data-label="Actions">
                <lightning-button-menu alternative-text="Row actions menu for edit and delete"
                    aria-label="Row actions menu" onselect={handleMenuSelect}>
                    <lightning-menu-item label="Edit" value={editMenuItemValue}
                        aria-label="Edit this adjustment detail row">
                    </lightning-menu-item>
                    <lightning-menu-item label="Delete" value={deleteMenuItemValue}
                        aria-label="Delete this adjustment detail row">
                    </lightning-menu-item>
                </lightning-button-menu>
            </td>
        </template>
    </tr>
</template>
