<template>
    <template if:true={hasTabMetadata}>
        <div class="slds-path" aria-label="Adjustment flow progress">
            <div class="slds-grid slds-path__track">
                <div class="slds-grid slds-path__scroller-container">
                    <div class="slds-path__scroller">
                        <div class="slds-path__scroller_inner">
                            <ul class="slds-path__nav" role="listbox" aria-label="Steps">
                                <template for:each={tabMetadata} for:item="tab">
                                    <li key={tab.tabNumber} class={tab.tabClass} role="presentation" aria-current={tab.isCurrentStep}>
                                        <span class="slds-path__stage">{tab.tabName}</span>
                                        <span class="slds-path__link slds-path__title" role="option" aria-selected={tab.isCurrentStepSelected} tabindex="0">{tab.tabName}</span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
