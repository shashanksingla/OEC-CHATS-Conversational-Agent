<template>
    <template if:true={toggleSpinner}>
        <lightning-spinner variant="brand" size="large"></lightning-spinner>
    </template>
    <template if:true={isOpen}>
        <div role="dialog" tabindex="-1" aria-labelledby="header43" class="slds-modal slds-fade-in-open">
            <div class="corspd-modal__container">
                <div class="slds-modal__header">
                    <button class="slds-button slds-modal__close slds-button--icon-inverse" title="Close" onclick={closeModel}>
                        X
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="manualscreen" class="slds-text-heading--medium">Create Manual Correspondence</h2>
                </div>
                <div class="slds-modal__content slds-p-around--medium">
                    <c-multiselect-combobox
                        label="Correspondence Type"
                        aria-label="Correspondence Type"
                        value={param.NME_CORSPD__c}
                        behavior-type="dynamic"
                        picklist-type="TableFetchPicklist"
                        method-name="getManualCorrespondences"
                        required="true"
                        name="NME_CORSPD__c"
                        onchange={handleOnChange}
                    ></c-multiselect-combobox>
                    <br />
                    <template if:true={isCR207}>
                        <lightning-input
                            type="String"
                            label="Case ID"
                            value={param.IDN_CASE__c}
                            disabled={cidbooleanCase}
                            onchange={hideProvider}
                            required={cr207CaseReq}
                        ></lightning-input>
                    </template>
                    <template if:false={isCR207}>
                        <lightning-input
                            type="String"
                            label="Case ID"
                            name="IDN_CASE__c"
                            value={param.IDN_CASE__c}
                            disabled={cidboolean}
                            required={isCaseRequired}
                            onchange={handleInput}
                        ></lightning-input>
                    </template>
                    <br />
                    <template if:true={isCR114}>
                        <lightning-input
                            type="String"
                            label="Client ID"
                            name="IDN_CLIENT__c"
                            onchange={handleInput}
                            value={param.IDN_CLIENT__c}
                            disabled={cidboolean}
                            required
                        ></lightning-input>
                    </template>
                    <template if:true={isCR207}>
                        <lightning-input
                            type="String"
                            label="Client ID"
                            name="IDN_CLIENT__c"
                            onchange={handleInput}
                            value={param.IDN_CLIENT__c}
                            disabled={cidbooleanCase}
                            required={cr207CaseReq}
                        ></lightning-input>
                    </template>
                    <br />
                    <template if:false={isCR207}>
                        <lightning-input
                            type="text"
                            pattern= "[0-9]*"
                            name="IDN_PROVR__c"
                            onchange={handleInput}
                            label="Provider ID"
                            value={param.IDN_PROVR__c}
                            disabled={isDisabled}
                            required={isRequired}
                        ></lightning-input>
                    </template>
                    <template if:true={isCR207}>
                        <lightning-input
                            type="number"
                            label="Provider ID"
                            value={param.IDN_PROVR__c}
                            disabled={pidbooleanProvider}
                            onchange={hideCase}
                            required={cr207ProviderReq}
                        ></lightning-input>
                    </template>
                    <br />
                    <lightning-input
                        type="number"
                        label="Adjustment ID"
                        name="IDN_ADJMT__c"
                        onchange={handleInput}
                        value={param.IDN_ADJMT__c}
                        disabled={isadjDisabled}
                        required={isadjRequired}
                    ></lightning-input>
                    <br />
                    <template if:false={isCR207}>
                        <c-multiselect-combobox
                            label="County"
                            value={param.CDE_COUNTY__c}
                            name="CDE_COUNTY__c"
                            onchange={handleCountyChange}
                            behavior-type="dynamic"
                            picklist-type="TableFetchPicklist"
                            method-name="getCountyCode"
                            disabled={isDisabled}
                            required={isRequired}
                        ></c-multiselect-combobox>
                    </template>
                    <template if:true={isCR207}>
                        <c-multiselect-combobox
                            label="County"
                            value={param.CDE_COUNTY__c}
                            picklist-type="TableFetchPicklist"
                            behavior-type="dynamic"
                            name="CDE_COUNTY__c"
                            onchange={handleInput}
                            method-name="getCountyCode"
                            disable={countyidboolean}
                            required={countyidboolean}
                        ></c-multiselect-combobox>
                    </template>
                    <br />
                    <template if:true={isValidCorrespondenceType}>
                        <template if:true={pidboolean}>
                            <lightning-input
                                type="date"
                                label="Date of Deadline"
                                onchange={handleDateInput}
                                required = true
                                name="DTE_DEADLINE__c"
                                value={manualchecklist.DTE_DEADLINE__c}
                            ></lightning-input>
                            <br />
                            <c-multiselect-combobox
                                label="Missing Verifications" 
                                onchange={handleInput}
                                value={param.CR107_Checklist__c}
                                name="CR107_Checklist__c"
                                behavior-type="checkbox"
                                required=true
                                object="T_DOC_RQ__c" 
                                field="CR107_Checklist__c"                           
                            ></c-multiselect-combobox>
                            <br />
                            <lightning-textarea 
                                type="String" 
                                onchange={handleInput}
                                label="OTHER" 
                                name="CR107_OTHER_TEXT__c" 
                                value={param.CR107_OTHER_TEXT__c} maxlength="255">
                            </lightning-textarea>
                        </template>

                        <template if:true={cidboolean}>
                            <lightning-input
                                type="date"
                                label="Date of Deadline"
                                onchange={handleDateInput}
                                required = true
                                name="DTE_702DEADLINE__c"
                                value={manualchecklist.DTE_702DEADLINE__c}
                            ></lightning-input>
                            <br />
                            <c-multiselect-combobox
                                label="Missing Verifications" 
                                onchange={handleInput}
                                value={param.CR702_Checklist__c}
                                name="CR702_Checklist__c"
                                behavior-type="checkbox"
                                required=true
                                object="T_DOC_RQ__c" 
                                field="CR702_Checklist__c"                           
                            ></c-multiselect-combobox>
                            <br />
                            <lightning-textarea 
                                type="String" 
                                label="Fingerprint Cards for: " 
                                name="CR702_TEXT__c" 
                                onchange={handleInput}
                                value={param.CR702_TEXT__c} maxlength="255">
                            </lightning-textarea>
                        </template>
                    </template>
                    <template if:true={isCR212}>
                        <c-multiselect-combobox
                            label="Information Needed" 
                            behavior-type="checkbox"
                            value={param.CR212_Checklist__c} 
                            name="CR212_Checklist__c"
                            onchange={handleInput}
                            object="T_DOC_RQ__c" 
                            field="CR212_Checklist__c" 
                            required=true
                        ></c-multiselect-combobox>
                    </template>
                    <br />
                    
                </div>
                <div class="slds-modal__footer">
                    <lightning-button
                        variant="brand"
                        label="Submit"
                        aria-label="Submit"
                        onclick={handleSubmit}
                        disabled={isDisbaleTrue}
                    ></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Cancel"
                        aria-label="Cancel"
                        class="slds-m-left_small"
                        onclick={handleNo}
                    ></lightning-button>
                </div>
            </div>
        </div>
        <div class="slds-backdrop slds-backdrop--open"></div>
    </template>
</template>
