<template>
    <div style="background:white" class="slds-p-around_medium slds-scrollable">
        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered"
            style="border:1px solid" role="grid">
            <thead>
                <tr class="slds-line-height_reset">
                    <template for:each={columns} for:item="colVal">
                        <th scope="col" key={colVal.label}>
                            <lightning-formatted-text value={colVal.label}></lightning-formatted-text>
                        </th>
                    </template>
                </tr>
            </thead>
            <tbody>
                <template for:each={processedData} for:item="row">
                    <tr key={row.fieldName}>
                        <td style="min-width:350px;">
                            <lightning-formatted-text value={row.Qlabel}></lightning-formatted-text>
                        </td>
                        <td class="feedbackCol" colspan={row.colspan}>
                            <template if:false={row.feedbackDisabled}>
                                <template lwc:if={isViewOnly}>
                                    <p><lightning-formatted-text value={row.feedback}></lightning-formatted-text>
                                    </p>
                                </template>
                                <template lwc:else>
                                    <c-custom-feedback-box identifier={row.fieldName} feedback={row.feedback}
                                        onpassfeedback={handleFeedback}></c-custom-feedback-box>
                                </template>
                            </template>
                        </td>
                        <template for:each={row.values} for:item="cell" for:index="index">
                            <td key={cell}>
                                <p><lightning-formatted-text class={cell.cls}
                                        value={cell.value}></lightning-formatted-text>
                                </p>

                            </td>
                        </template>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</template>
