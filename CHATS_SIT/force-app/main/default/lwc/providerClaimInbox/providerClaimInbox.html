<template>
    <template lwc:if={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="base"></lightning-spinner>
    </template>
    <lightning-card icon-name="standard:event" title="Provider Claim Inbox">
        <template if:true={initDone}>
            <div class="slds-m-around_large" style="background-color: rgb(255, 255, 255);">
                <div>
                    <lightning-layout multiple-rows>
                        <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                            <div>
                                <c-multiselect-combobox label="County" object="User" field="Owner_County__c"
                                    data-id="input-field" data-name="userCounty" onselect={handlePickselect}
                                    value={claimInboxWrapper.county} multi-select required
                                    show-none></c-multiselect-combobox>
                                <c-field-level-message_lwc data-id="Owner_County__c"></c-field-level-message_lwc>
                            </div>
                        </lightning-layout-item>
                        <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                            <c-custom-lookup_lwc label="Provider ID" class="providerId" object-label="Provider"
                                data-id="input-field" object-api-name="T_CHATS_PROVR_STATUS__c" show-recent-records=true
                                onvalueselected={handleValueSelectedOnAccount}>
                            </c-custom-lookup_lwc>
                            <c-field-level-message_lwc data-id="T_CHATS_PROVR_STATUS__c"></c-field-level-message_lwc>
                        </lightning-layout-item>
                        <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                            <c-multiselect-combobox label="Care Month" object="Provider_Manual_Claim__c"
                                data-id="input-field" data-name="careMonth" field="Care_Month__c"
                                behavior-type="picklist" value={claimInboxWrapper.careMonth} onselect={handlePickselect}
                                hidden-values={hiddenMonths} show-none></c-multiselect-combobox>
                            <c-field-level-message_lwc data-id="careMonth"></c-field-level-message_lwc>
                        </lightning-layout-item>
                        <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                            <c-multiselect-combobox label="Care Year" object="Provider_Manual_Claim__c"
                                field="Care_Year__c" data-id="input-field" data-name="careYear" behavior-type="picklist"
                                value={claimInboxWrapper.careYear} already-has-values options={sampleYearOptions}
                                onselect={handlePickselect} show-none></c-multiselect-combobox>
                            <c-field-level-message_lwc data-id="careYear"></c-field-level-message_lwc>
                        </lightning-layout-item>
                        <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                            <c-multiselect-combobox label="Manual Claim Record Status" object="Provider_Manual_Claim__c"
                                data-id="input-field" data-name="appStatus" field="Claim_Status__c" already-has-values
                                options={statusOptions} value={claimInboxWrapper.status} onselect={handlePickselect}
                                multi-select show-none>
                            </c-multiselect-combobox>
                            <c-field-level-message_lwc data-id="appStatus"></c-field-level-message_lwc>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
            </div>
            <div class="slds-m-around_large" style="background-color: rgb(255, 255, 255);">
                <div class="slds-p-left_medium">
                    <h3 class="slds-card__header-title">
                        <span>Name Search</span>
                    </h3>
                </div>

                <lightning-layout multiple-rows>
                    <lightning-layout-item flexibility="auto" size="2" padding="around-small">
                        <lightning-input data-id="input-field" type="text" data-name="providerName"
                            label="Provider Facility Name" value={claimInboxWrapper.providerName}
                            onchange={handleCompSelect} disabled={isLookupSelected}>
                        </lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" size="12" padding="around-small">
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" size="10" padding="" class="slds-p-top_x-large">
                    </lightning-layout-item>
                </lightning-layout>
            </div>
            <div class="slds-m-around_large" style="background-color: rgb(255, 255, 255);">
                <div class="slds-p-left_medium">
                    <h3 class="slds-card__header-title">
                        <span>Claim Submitted Date Range</span>
                    </h3>
                </div>
                <lightning-layout multiple-rows class="height-setup">
                    <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                        <lightning-input type="date" data-id="input-field" data-name="fromDate" date-style="short"
                            label="Claim Submitted Begin Date" value={claimInboxWrapper.fromDate}
                            onchange={handleCompSelect}>
                        </lightning-input>
                        <c-field-level-message_lwc data-id="fromDate"></c-field-level-message_lwc>
                    </lightning-layout-item>

                    <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                        <lightning-input type="date" data-id="input-field" data-name="toDate" date-style="short"
                            label="Claim Submitted End Date" value={claimInboxWrapper.toDate}
                            onchange={handleCompSelect}>
                        </lightning-input>
                        <c-field-level-message_lwc data-id="toDate"></c-field-level-message_lwc>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" size="3" class="slds-p-top_x-large">
                        <lightning-button label="View Results" variant="brand"
                            onclick={viewClaimResults}></lightning-button>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" size="3" padding="around-small"
                        class="slds-p-top_x-large"></lightning-layout-item>
                </lightning-layout>
            </div>
        </template>
        <br />
        <template if:true={showTable}>
            <div class="slds-p-horizontal_small slds-m-top--large">
                <div class="slds-text-heading--medium slds-modal__header slds-border_top">
                    <h1>Provider Manual Claim Results</h1>
                </div>
                <div class="slds-align_absolute-center slds-p-around_x-small">
                    <div class="slds-button-group " role="group">
                        <lightning-button-group>
                            <lightning-button label="Previous" onclick={handlePrevious}
                                disabled={isPreviousDisabled}></lightning-button>
                            <lightning-button label="Next" onclick={handleNext}
                                disabled={isNextDisabled}></lightning-button>
                        </lightning-button-group>
                    </div>
                </div>
                <lightning-datatable key-field="Id" data={claimResultWrapper} columns={columns} wrap-table-header
                    hide-checkbox-column sorted-by={sortedBy} sorted-direction={sortedDirection}
                    onsort={onSort}></lightning-datatable>
            </div>
        </template>
    </lightning-card>
</template>
