<template>
    <template if:true={showSpinner}>
        <lightning-spinner variant="brand" size="medium"></lightning-spinner>
    </template>

    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" 
                 aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" onclick={closeModel} 
                                           alternative-text="close" variant="bare-inverse" 
                                           class="slds-modal__close"></lightning-button-icon>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Recurrence Pattern</h2>
                </header>
                
                <div class="slds-modal__content slds-p-around_small" id="modal-content-id-1">
                    <template if:false={isReadOnly}>
                        <lightning-layout multiple-rows="true" horizontal-align="space">
                            <lightning-layout-item flexibility="auto" size="6" class="slds-is-relative">
                                <lightning-combobox label="Frequency" name="frequency" options={frequency} data-id="input-field"
                                                    placeholder="-- None --" value={scheduleRecurrObj.Recur_Type__c} data-field="Recur_Type__c"
                                                    onchange={handleInputChange} required="true">
                                </lightning-combobox>
                            </lightning-layout-item>
                            <lightning-layout-item flexibility="auto" size="6" class="slds-is-relative"></lightning-layout-item>
                            <br />
                            
                            <lightning-layout-item flexibility="auto" size="6" class="slds-is-relative">
                                <template if:true={isDailyWeeklyOrEveryOtherWeek}>
                                    <div class="slds-col">
                                        <span>
                                            Recurs every week on
                                            <template for:each={weekDays} for:item="item" for:index="index">
                                                <table key={item.value} class="slds-table slds-table" style="margin-top:0px;">
                                                    <tbody>
                                                        <tr scope="col">
                                                            <td>
                                                                <lightning-input type="checkbox" label={item.label} data-index={index} 
                                                                                 value={item.value} data-id="weekTime" 
                                                                                 class="slds-p-vertical_small" onchange={selectWeeks}>
                                                                </lightning-input>
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </template>
                                        </span>
                                    </div>
                                </template>
                                
                                <template if:true={isMonthly}>
                                    <div class="slds-col">
                                        <c-multiselect-combobox multi-select name="DaysOfMonth"
                                                label="Days of Month" value={scheduleRecurrObj.DaysOfMonth__c} data-id="input-field"
                                                options={dateToSelect} already-has-values="true" required="true" onselect={selectDaysOfMonth}>
                                        </c-multiselect-combobox>
                                        <c-field-level-message_lwc data-id="inputMultiSelectPIcklistError"></c-field-level-message_lwc>
                                    </div>
                                </template>
                            </lightning-layout-item>
                            <lightning-layout-item flexibility="auto" size="6" class="slds-is-relative"></lightning-layout-item>
                        </lightning-layout>

                        <br/>

                        <lightning-layout multiple-rows="true" horizontal-align="space">
                            <lightning-layout-item flexibility="auto" size="6" class="slds-is-relative">
                                <label class="slds-form-element__label" style="margin-right: 0.5rem;" required="true">
                                    <b>Range of recurrence</b>
                                </label><br />
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" size="6" class="slds-is-relative"></lightning-layout-item>

                            <lightning-layout-item flexibility="auto" size="3" class="slds-is-relative">
                                <lightning-input type="date" required="true" data-field="DTE_Begin_Date__c" data-id="input-field"
                                                 label="Start Date" value={scheduleRecurrObj.DTE_Begin_Date__c} onchange={handleInputChange}>
                                </lightning-input>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" size="1" class="slds-is-relative"></lightning-layout-item>

                            <lightning-layout-item flexibility="auto" size="3" class="slds-is-relative">
                                <lightning-input type="date" value={scheduleRecurrObj.DTE_End_Date__c} data-field="DTE_End_Date__c" data-id="input-field"
                                                required="true" label="End Date" onchange={handleInputChange}>
                                </lightning-input>
                            </lightning-layout-item>

                            <lightning-layout-item flexibility="auto" size="1" class="slds-is-relative"></lightning-layout-item>
                            <lightning-layout-item flexibility="auto" size="4" class="slds-is-relative"></lightning-layout-item>
                        </lightning-layout>
                    </template>
                    
                    <br/>
                    
                    <lightning-layout multiple-rows="true" horizontal-align="space">
                        <lightning-layout-item flexibility="auto" size="6" class="slds-is-relative">
                            <template lwc:if={isCreate}>
                                <b>Create Recurring Schedule:</b>
                            </template>    
                                <template lwc:else>
                                    <b>Edit/Create Recurring Schedule:</b>
                                </template>
                        </lightning-layout-item>

                        <lightning-layout-item flexibility="auto" size="6" class="slds-is-relative"></lightning-layout-item>

                        <lightning-layout-item flexibility="auto" size="12" class="slds-is-relative">
                            <lightning-datatable data={scheduleRecurr} columns={columns} key-field="id" 
                                                 onrowaction={handleRowAction} hide-checkbox-column="true" 
                                                 min-column-width="150" wrap-text-max-lines="2">
                            </lightning-datatable>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
                
                <footer class="slds-modal__footer">
                    <lightning-button label="Create" variant="brand" onclick={doSchedule} disabled={isReadOnly}>
                    </lightning-button>&nbsp;
                    <lightning-button label="Done" onclick={doCancel} disabled={isReadOnly}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showEditModal}>
        <lightning-layout-item flexibility="auto" padding="around-small" size="12">
            <c-edit-recurrence-pattern-flow_lwc record-id={recurrenceRecordId} 
                                            show-edit-modal={showEditModal} 
                                            schedule-recurr={scheduleRecurr}
                                            auth-end-date={authEndDate}
                                            onclose={handleclose}>
            </c-edit-recurrence-pattern-flow_lwc>
        </lightning-layout-item>
    </template>
</template>
