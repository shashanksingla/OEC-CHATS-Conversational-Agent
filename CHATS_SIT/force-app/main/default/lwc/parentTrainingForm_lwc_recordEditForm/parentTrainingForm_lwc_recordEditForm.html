<template>
    <div class="slds-card__body slds-card__body_inner">
        
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>

        <!-- Error Message -->
        <template if:true={error}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                <span class="slds-assistive-text">Error</span>
                <h2>Error: {error}</h2>
            </div>
        </template>

        <!-- Form Header -->
        <div class="slds-page-header slds-page-header_record-home slds-m-bottom_medium">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:education" size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate" title="Parent Training">
                                            {recordTitle}
                                        </span>
                                    </h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Record Edit Form -->
        <lightning-record-edit-form 
            object-api-name="T_INDIV_TRAIN__c" 
            record-id={recordId}
            onsuccess={handleSuccess}
            onerror={handleError}
            onload={handleLoad}>
            
            <!-- Two Column Layout -->
            <div class="slds-grid slds-gutters slds-wrap">
                
                <!-- Column 1 -->
                <div class="slds-col slds-size_1-of-2">
                    <fieldset class="slds-form-element">
                        <div class="slds-form-element__control">

                            <!-- Client ID (Required Lookup) -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="IDN_CLIENT__c"
                                    required
                                    value={clientId}>
                                </lightning-input-field>
                            </div>

                            <!-- Training Institution Name -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    required
                                    field-name="NAM_INSTN_TRAIN__c">
                                </lightning-input-field>
                            </div>

                            <!-- SUD-specific fields - Address Line 1 -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="ADR_LINE_1__c"
                                    required={isSudSelected}
                                    data-field="addressLine1">
                                </lightning-input-field>
                            </div>

                            <!-- SUD-specific fields - State of Facility -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="ADR_STATE__c"
                                    required={isSudSelected}
                                    data-field="stateOfFacility">
                                </lightning-input-field>
                            </div>

                            <!-- SUD-specific fields - Zip -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="ADR_ZIP_MAIN__c"
                                    required={isSudSelected}
                                    data-field="zip">
                                </lightning-input-field>
                            </div>

                            <!-- SUD-specific fields - Licensed by BHA -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="Licensed_by_BHA__c"
                                    required={isSudSelected}
                                    disabled={isSudDisabled}
                                    data-field="licensedByBHA">
                                </lightning-input-field>
                            </div>

                            <!-- Verified -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="CDE_TYPE_VERIF__c"
                                    required
                                    disabled={isSudSelected}
                                    data-field="verified">
                                </lightning-input-field>
                            </div>

                            <!-- Effective Begin Date (Required) -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="DTE_BEGIN_EFFV__c"
                                    required>
                                </lightning-input-field>
                            </div>

                            <!-- Anticipated Completion Date -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="DTE_END_ANT__c">
                                </lightning-input-field>
                            </div>

                            <!-- Temporary Break Effective Begin Date -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="DTE_BEGIN_EFFV_INFO__c">
                                </lightning-input-field>
                            </div>

                            <!-- Training or Education ID (Read Only) -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-output-field 
                                    field-name="Name">
                                </lightning-output-field>
                            </div>
                        </div>
                    </fieldset>
                </div>

                <!-- Column 2 -->
                <div class="slds-col slds-size_1-of-2">
                    <fieldset class="slds-form-element">
                        <div class="slds-form-element__control">
                            
                            <!-- Training or Education Type -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    required
                                    field-name="CDE_TYPE_TRAIN__c"
                                    onchange={handleTrainingTypeChange}
                                    data-field="trainingType">
                                </lightning-input-field>
                            </div>

                            <!-- SUD-specific fields - City -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="City__c"
                                    required={isSudSelected}
                                    data-field="city">
                                </lightning-input-field>
                            </div>

                            <!-- SUD-specific fields - Address Line 2 -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="ADR_LINE_2__c"
                                    data-field="addressLine2">
                                </lightning-input-field>
                            </div>

                            <!-- SUD-specific fields - Zip Ext -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="ADR_ZIP_EXTN__c"
                                    data-field="zipExt">
                                </lightning-input-field>
                            </div>

                            <!-- SUD-specific fields - Treatment Types -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="Treatment_Types__c"
                                    required={isSudSelected}
                                    disabled={isSudDisabled}
                                    data-field="treatmentTypes">
                                </lightning-input-field>
                            </div>

                            <!-- SUD-specific fields - Hours Per week of SUD CCCAP-15444-->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="HOURS_SUD__c"
                                    disabled={isSudDisabled}
                                    data-field="HrsSUD">
                                </lightning-input-field>
                            </div>

                            
                            <!-- How Verified -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="CDE_SOURCE_VRFYD__c"
                                    disabled={isSudSelected}
                                    data-field="howVerified">
                                </lightning-input-field>
                            </div>


                            <!-- Effective End Date -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="DTE_END_EFFV__c">
                                </lightning-input-field>
                            </div>

                            <!-- Temporary Break Type -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="CDE_TYPE_INFO_TRAIN__c">
                                </lightning-input-field>
                            </div>

                            <!-- Temporary Break Effective End Date -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="DTE_END_EFFV_INFO__c">
                                </lightning-input-field>
                            </div>

                            <!-- Ignore Checkbox -->
                            <div class="slds-form-element slds-m-bottom_small">
                                <lightning-input-field 
                                    field-name="Ignore__c">
                                </lightning-input-field>
                            </div>
                        </div>
                    </fieldset>
                </div>
            </div>

            <!-- Form Buttons -->
            <div class="slds-m-top_large slds-text-align_center">
                <lightning-button 
                    variant="neutral" 
                    label="Cancel" 
                    onclick={handleCancel}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button 
                    variant="brand" 
                    type="submit" 
                    label="Save">
                </lightning-button>
            </div>

        </lightning-record-edit-form>

    </div>
</template>
