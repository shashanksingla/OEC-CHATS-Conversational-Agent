<template>
    <!-- Modal Header -->
    <lightning-modal-header label={modalLabel}>
    </lightning-modal-header>

    <!-- Modal Body - Embeds the standalone component with all business logic -->
    <lightning-modal-body role="region" aria-label="Adjustment Note Form">
        <c-adjustment-note-override_lwc record-id={recordId} object-api-name={objectApiName}
            from-adjustment-flow={isFromAdjustmentFlow} onsave={handleSave} onclose={handleClose}>
        </c-adjustment-note-override_lwc>
    </lightning-modal-body>

    <!-- Modal Footer -->
    <lightning-modal-footer>
    </lightning-modal-footer>
</template>
