<template>
    <!-- Loading Spinner -->
    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading adjustment summary..." size="medium"></lightning-spinner>
    </template>

    <!-- Summary Header Section -->
    <h2 id="adjustment-summary-heading" class="slds-assistive-text">Adjustment Summary</h2>
    <div role="region" aria-labelledby="adjustment-summary-heading">
        <lightning-layout multiple-rows="true" horizontal-align="space">
            <!-- Adjustment ID -->
            <lightning-layout-item flexibility="auto" size="4" padding="around-small">
                <c-output-field_lwc label="Adjustment ID" value={adjustmentObj.Name}></c-output-field_lwc>
            </lightning-layout-item>

            <!-- Adjustment Type -->
            <lightning-layout-item flexibility="auto" size="4" padding="around-small">
                <c-output-field_lwc label="Adjustment Type"
                    value={adjustmentObj.CDE_TYPE_ADJMT__c}></c-output-field_lwc>
            </lightning-layout-item>

            <!-- Provider ID (shown when Provider ID is populated) -->
            <template if:true={adjustmentObj.IDN_PROVR__c}>
                <lightning-layout-item flexibility="auto" size="4" padding="around-small">
                    <c-output-field_lwc label="Provider ID"
                        value={adjustmentObj.IDN_PROVR__r.Name}></c-output-field_lwc>
                </lightning-layout-item>

                <lightning-layout-item flexibility="auto" size="4" padding="around-small">
                    <c-output-field_lwc label="Provider Name"
                        value={adjustmentObj.IDN_PROVR__r.NAM_FACILITY__c}></c-output-field_lwc>
                </lightning-layout-item>
            </template>

            <!-- Case ID (shown when Case ID is populated) -->
            <template if:true={adjustmentObj.IDN_CASE__c}>
                <lightning-layout-item flexibility="auto" size="4" padding="around-small">
                    <c-output-field_lwc label="Case ID" value={adjustmentObj.IDN_CASE__r.Name}></c-output-field_lwc>
                </lightning-layout-item>

                <lightning-layout-item flexibility="auto" size="4" padding="around-small">
                    <template if:true={individualObj}>
                        <c-output-field_lwc label="Primary Caretaker" value={primaryCaretakerName}></c-output-field_lwc>
                    </template>
                </lightning-layout-item>
            </template>

            <!-- Status -->
            <lightning-layout-item flexibility="auto" size="4" padding="around-small">
                <c-output-field_lwc label="Status" value={adjustmentObj.CDE_STATUS_ADJMT__c}></c-output-field_lwc>
            </lightning-layout-item>

            <!-- Adjustment Amount -->
            <lightning-layout-item flexibility="auto" size="4" padding="around-small">
                <label id="adjustment-amount-label" class="slds-form-element__label">Adjustment Amount</label><br />
                <lightning-formatted-number aria-labelledby="adjustment-amount-label" value={adjustmentAmountDisplay}
                    format-style="currency" currency-code="USD"></lightning-formatted-number>
            </lightning-layout-item>
        </lightning-layout>
    </div>

    <!-- Adjustment Details Table - Bug fix 3553: removed slds-grid class to enable scrolling -->
    <div aria-live="polite" aria-atomic="true">
        <div class="slds-wrap slds-p-around_small slds-scrollable" role="region" aria-label="Adjustment Details"
            tabindex="0">
            <table class="slds-table slds-table_bordered" role="grid" aria-label="Adjustment Details Table">
                <thead>
                    <tr class="slds-text-title_caps" role="row">
                        <!-- Provider ID Column (shown when Provider ID is populated) -->
                        <template if:true={showProviderColumns}>
                            <th scope="col" role="columnheader" aria-sort="none">
                                <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Provider ID"
                                    data-id="subPaymentDetails.idn_pmt_sub__r.idn_auth__r.IDN_PROVR__r.Name"
                                    tabindex="0" role="button" aria-label="Sort by Provider ID">
                                    Provider ID
                                    <template if:true={sortIconProviderID}>
                                        <lightning-icon icon-name={sortIconProviderID}
                                            alternative-text="Sort indicator for Provider ID"
                                            size="xx-small"></lightning-icon>
                                    </template>
                                </div>
                            </th>
                            <th scope="col" role="columnheader" aria-sort="none">
                                <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Provider Name"
                                    data-id="subPaymentDetails.idn_pmt_sub__r.idn_auth__r.NAM_FACILITY__c" tabindex="0"
                                    role="button" aria-label="Sort by Provider Name">
                                    Provider Name
                                    <template if:true={sortIconProviderName}>
                                        <lightning-icon icon-name={sortIconProviderName}
                                            alternative-text="Sort indicator for Provider Name"
                                            size="xx-small"></lightning-icon>
                                    </template>
                                </div>
                            </th>
                        </template>

                        <!-- Case ID Column (shown when Case ID is populated) -->
                        <template if:true={showCaseIdColumn}>
                            <th scope="col" role="columnheader" aria-sort="none">
                                <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Case ID"
                                    data-id="subPaymentDetails.idn_pmt_sub__r.idn_auth__r.IDN_CASE__r.Name" tabindex="0"
                                    role="button" aria-label="Sort by Case ID">
                                    Case ID
                                    <template if:true={sortIconCaseID}>
                                        <lightning-icon icon-name={sortIconCaseID}
                                            alternative-text="Sort indicator for Case ID"
                                            size="xx-small"></lightning-icon>
                                    </template>
                                </div>
                            </th>
                        </template>

                        <!-- Child First Name -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Child First Name"
                                data-id="subPaymentDetails.idn_pmt_sub__r.idn_auth__r.NAM_FIRST__c" tabindex="0"
                                role="button" aria-label="Sort by Child First Name">
                                Child First Name
                                <template if:true={sortIconChildFirstName}>
                                    <lightning-icon icon-name={sortIconChildFirstName}
                                        alternative-text="Sort indicator for Child First Name"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Child Last Name -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Child Last Name"
                                data-id="subPaymentDetails.idn_pmt_sub__r.idn_auth__r.NAM_LAST__c" tabindex="0"
                                role="button" aria-label="Sort by Child Last Name">
                                Child Last Name
                                <template if:true={sortIconChildLastName}>
                                    <lightning-icon icon-name={sortIconChildLastName}
                                        alternative-text="Sort indicator for Child Last Name"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Care Date -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Care Date"
                                data-id="subPaymentDetails.dte_care__c" tabindex="0" role="button"
                                aria-label="Sort by Care Date">
                                Care Date
                                <template if:true={sortIconCareDate}>
                                    <lightning-icon icon-name={sortIconCareDate}
                                        alternative-text="Sort indicator for Care Date"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Authorized Hours -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Authorized Hours"
                                data-id="subPaymentDetails.cde_unit_care_exptd__c" tabindex="0" role="button"
                                aria-label="Sort by Authorized Hours">
                                Authorized Hours
                                <template if:true={sortIconAuthorizedHours}>
                                    <lightning-icon icon-name={sortIconAuthorizedHours}
                                        alternative-text="Sort indicator for Authorized Hours"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Authorized Rate Type -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn}
                                title="Authorized Rate Type" data-id="subPaymentDetails.cde_type_unit_care__c"
                                tabindex="0" role="button" aria-label="Sort by Authorized Rate Type">
                                Authorized Rate Type
                                <template if:true={sortIconAuthorizedRateType}>
                                    <lightning-icon icon-name={sortIconAuthorizedRateType}
                                        alternative-text="Sort indicator for Authorized Rate Type"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Attended Hours -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Attended Hours"
                                data-id="subPaymentDetails.cde_unit_care_actual__c" tabindex="0" role="button"
                                aria-label="Sort by Attended Hours">
                                Attended Hours
                                <template if:true={sortIconAttendedHours}>
                                    <lightning-icon icon-name={sortIconAttendedHours}
                                        alternative-text="Sort indicator for Attended Hours"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Unit Paid -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Unit Paid"
                                data-id="subPaymentDetails.cde_time_trdnl__c" tabindex="0" role="button"
                                aria-label="Sort by Unit Paid">
                                Unit Paid
                                <template if:true={sortIconUnitPaid}>
                                    <lightning-icon icon-name={sortIconUnitPaid}
                                        alternative-text="Sort indicator for Unit Paid"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Rate Paid -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Rate Paid"
                                data-id="subPaymentDetails.amt_rate__c" tabindex="0" role="button"
                                aria-label="Sort by Rate Paid">
                                Rate Paid
                                <template if:true={sortIconRatePaid}>
                                    <lightning-icon icon-name={sortIconRatePaid}
                                        alternative-text="Sort indicator for Rate Paid"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Parent Fee -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Parent Fee"
                                data-id="subPaymentDetails.amt_copay__c" tabindex="0" role="button"
                                aria-label="Sort by Parent Fee">
                                Parent Fee
                                <template if:true={sortIconParentFee}>
                                    <lightning-icon icon-name={sortIconParentFee}
                                        alternative-text="Sort indicator for Parent Fee"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Amount Paid -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Amount Paid"
                                data-id="subPaymentDetails.amt_total__c" tabindex="0" role="button"
                                aria-label="Sort by Amount Paid">
                                Amount Paid
                                <template if:true={sortIconAmountPaid}>
                                    <lightning-icon icon-name={sortIconAmountPaid}
                                        alternative-text="Sort indicator for Amount Paid"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Adjusted Authorized Hours -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn}
                                title="Adjusted Authorized Hours" data-id="ajustmentDetails.NBR_HOURS_AUTH_ADJD__c"
                                tabindex="0" role="button" aria-label="Sort by Adjusted Authorized Hours">
                                Adjusted Authorized Hours
                                <template if:true={sortIconAdjustedAuthHours}>
                                    <lightning-icon icon-name={sortIconAdjustedAuthHours}
                                        alternative-text="Sort indicator for Adjusted Authorized Hours"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Adjusted Attended Hours -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn}
                                title="Adjusted Attended Hours" data-id="ajustmentDetails.NBR_HOURS_ATTND_ADJD__c"
                                tabindex="0" role="button" aria-label="Sort by Adjusted Attended Hours">
                                Adjusted Attended Hours
                                <template if:true={sortIconAdjustedAttendedHours}>
                                    <lightning-icon icon-name={sortIconAdjustedAttendedHours}
                                        alternative-text="Sort indicator for Adjusted Attended Hours"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Adjusted Rate Type -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Adjusted Rate Type"
                                data-id="ajustmentDetails.CDE_TYPE_RATE_ADJD__c" tabindex="0" role="button"
                                aria-label="Sort by Adjusted Rate Type">
                                Adjusted Rate Type
                                <template if:true={sortIconAdjustedRateType}>
                                    <lightning-icon icon-name={sortIconAdjustedRateType}
                                        alternative-text="Sort indicator for Adjusted Rate Type"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Adjusted Rate Paid -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Adjusted Rate Paid"
                                data-id="ajustmentDetails.AMT_PAID_RATE_ADJD__c" tabindex="0" role="button"
                                aria-label="Sort by Adjusted Rate Paid">
                                Adjusted Rate Paid
                                <template if:true={sortIconAdjustedRatePaid}>
                                    <lightning-icon icon-name={sortIconAdjustedRatePaid}
                                        alternative-text="Sort indicator for Adjusted Rate Paid"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Adjusted Amount -->
                        <th scope="col" role="columnheader" aria-sort="none">
                            <div onclick={handleSortByColumn} onkeydown={handleSortByColumn} title="Adjusted Amount"
                                data-id="ajustmentDetails.AMT_DETAIL_ADJMT__c" tabindex="0" role="button"
                                aria-label="Sort by Adjusted Amount">
                                Adjusted Amount
                                <template if:true={sortIconAdjustedAmount}>
                                    <lightning-icon icon-name={sortIconAdjustedAmount}
                                        alternative-text="Sort indicator for Adjusted Amount"
                                        size="xx-small"></lightning-icon>
                                </template>
                            </div>
                        </th>

                        <!-- Action Column (shown when not in view mode) -->
                        <template if:true={showActionColumn}>
                            <th scope="col" role="columnheader" aria-label="Row Actions">
                                <div title="Actions" role="button" aria-label="Actions" class="action-header">
                                    Actions
                                </div>
                            </th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={adjustmentDtlWarp} for:item="adjDetailWrap" for:index="index">
                        <c-adjustment-detail-row_lwc key={adjDetailWrap.ajustmentDetails.Id}
                            current-tab-number={currentTabNumber} adjustment-dtl-warp={adjDetailWrap}
                            adjustment={adjustmentObj} rate-type-options-map={rateTypeOptionsMap}
                            sub-payment-detail={adjDetailWrap.subPaymentDetails}
                            selected-sub-payment={selectedSubPayment} rate-type-options={rateTypeOptions}
                            adjustment-dtl-warp-arr={adjustmentDtlWarp} row-index={index}
                            adjust-detail-map={adjustDetailMap} care-unit-type-options-map={careUnitTypeOptionsMap}
                            care-level-options-map={careLevelOptionsMap} care-unit-type-options={careUnitTypeOptions}
                            care-level-options={careLevelOptions} child-current-utilization={childCurrentUtilization}
                            disabled-a-r-t-fees={disabledARTFees} page-mode={pageMode}
                            slot-cntcheckbox={slotCntcheckbox} active-a-r-t-fee-records={activeARTFeeRecords}
                            oncreateadjustdetails={handleCreateAdjustDetails}>
                        </c-adjustment-detail-row_lwc>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</template>
