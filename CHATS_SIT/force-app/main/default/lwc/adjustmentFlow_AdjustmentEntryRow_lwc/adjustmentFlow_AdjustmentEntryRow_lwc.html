<template>
    <!-- Main row wrapper -->
    <tr role="row">
        <!-- ============================================================ -->
        <!-- MODE 1: artFeeFlag = false — Main Adjustment Row              -->
        <!-- ============================================================ -->
        <template if:false={artFeeFlag}>

            <!-- -------------------------------------------------------- -->
            <!-- SUB-MODE A: slotCntcheckbox = true — Slot Contract Mode  -->
            <!-- -------------------------------------------------------- -->
            <template if:true={slotCntcheckbox}>

                <!-- Selection Checkbox -->
                <td class="row-cell checkbox-cell" role="gridcell">
                    <lightning-input
                        type="checkbox"
                        label="Select"
                        variant="label-hidden"
                        aria-label="Select row for adjustment"
                        checked={adjustmentDetail.Adjustment_Initiated__c}
                        onchange={handleCheckboxChange}>
                    </lightning-input>
                </td>

                <!-- Slot Contract ID -->
                <td class="row-cell slot-cell readonly-cell" role="gridcell">
                    <div aria-label="Slot Contract ID">{subPaymentDetail.idn_pmt_sub__r.idn_slot_contract__r.Name}</div>
                </td>

                <!-- Care Date -->
                <td class="row-cell slot-cell readonly-cell" role="gridcell">
                    <div aria-label="Care Date">{subPaymentDetail.dte_care__c}</div>
                </td>

                <!-- Care Level Paid -->
                <td class="row-cell slot-cell readonly-cell" role="gridcell">
                    <div aria-label="Care Level Paid">{displayCareLevelPaid}</div>
                </td>

                <!-- Adjusted Care Level (dropdown) -->
                <td class="row-cell slot-cell dropdown-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Care Level">{existingAdj.CDE_CARE_LEVEL_ADJD__c}</div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <c-multiselect-combobox
                            label="Adjusted Care Level"
                            aria-label="Adjusted Care Level"
                            value={adjustmentDetail.CDE_CARE_LEVEL_ADJD__c}
                            options={careLevelOptions}
                            disabled={isCareLevelDisabled}
                            data-field="CDE_CARE_LEVEL_ADJD__c"
                            behavior-type="picklist"
                            show-none
                            hide-label
                            already-has-values
                            onselect={handleSelectChange}>
                        </c-multiselect-combobox>
                    </template>
                </td>

                <!-- Unit Type Paid -->
                <td class="row-cell slot-cell readonly-cell" role="gridcell">
                    <div aria-label="Unit Type Paid">{displayUnitPaid}</div>
                </td>

                <!-- Adjusted Unit Type (dropdown) -->
                <td class="row-cell slot-cell dropdown-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Unit Type">{existingAdj.CDE_TYPE_UNIT_ADJD__c}</div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <c-multiselect-combobox
                            label="Adjusted Unit Type"
                            aria-label="Adjusted Unit Type"
                            value={adjustmentDetail.CDE_TYPE_UNIT_ADJD__c}
                            options={careUnitTypeOptions}
                            disabled={isInputDisabled}
                            data-field="CDE_TYPE_UNIT_ADJD__c"
                            behavior-type="picklist"
                            show-none
                            hide-label
                            already-has-values
                            onselect={handleSelectChange}>
                        </c-multiselect-combobox>
                    </template>
                </td>

                <!-- Rate Type Paid -->
                <td class="row-cell slot-cell readonly-cell" role="gridcell">
                    <div aria-label="Rate Type Paid">{displayRateTypePaid}</div>
                </td>

                <!-- Adjusted Rate Type (dropdown) -->
                <td class="row-cell slot-cell dropdown-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Rate Type">{displayExistingAdjRateType}</div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <c-multiselect-combobox
                            label="Adjusted Rate Type"
                            aria-label="Adjusted Rate Type"
                            value={adjustmentDetail.CDE_TYPE_RATE_ADJD__c}
                            options={rateTypeOptions}
                            disabled={isInputDisabled}
                            data-field="CDE_TYPE_RATE_ADJD__c"
                            behavior-type="picklist"
                            hide-label
                            already-has-values
                            onselect={handleSelectChange}>
                        </c-multiselect-combobox>
                    </template>
                </td>

                <!-- Vacant Slot Amount -->
                <td class="row-cell slot-cell readonly-cell" role="gridcell">
                    <lightning-formatted-number
                        value={subPaymentDetail.amt_slot_paid__c}
                        format-style="currency"
                        currency-code="USD"
                        aria-label="Vacant Slot Amount">
                    </lightning-formatted-number>
                </td>

                <!-- 0-36 Months Enrollment -->
                <td class="row-cell slot-cell readonly-cell" role="gridcell">
                    <div aria-label="0-36 Months Enrollment">{enrollmentPaymentIndicator}</div>
                </td>

                <!-- Adjusted Rate Amount (input / read-only) -->
                <td class="row-cell slot-cell currency-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Rate Amount">
                            <lightning-formatted-number
                                value={existingAdj.AMT_PAID_RATE_ADJD__c}
                                format-style="currency"
                                currency-code="USD">
                            </lightning-formatted-number>
                        </div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <template if:true={adjustmentDetail.IND_OVERRIDE__c}>
                            <lightning-input
                                type="number"
                                label="Adjusted Rate Amount"
                                variant="label-hidden"
                                aria-label="Adjusted Rate Amount"
                                step="0.01"
                                min="0.00"
                                formatter="currency"
                                data-field="AMT_PAID_RATE_ADJD__c"
                                value={adjustmentDetail.AMT_PAID_RATE_ADJD__c}
                                disabled={isInputDisabled}
                                message-when-range-underflow="Negative amounts are not accepted."
                                message-when-step-mismatch="Please enter an amount with two decimal places."
                                onchange={handleAmountChange}>
                            </lightning-input>
                        </template>
                        <template if:false={adjustmentDetail.IND_OVERRIDE__c}>
                            <div aria-label="Adjusted Rate Amount">
                                <lightning-formatted-number
                                    value={adjustmentDetail.AMT_PAID_RATE_ADJD__c}
                                    format-style="currency"
                                    currency-code="USD">
                                </lightning-formatted-number>
                            </div>
                        </template>
                    </template>
                </td>

                <!-- Override Checkbox -->
                <td class="row-cell checkbox-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div>
                            <lightning-input
                                type="checkbox"
                                label="Override"
                                variant="label-hidden"
                                aria-label="Override Standard Amount"
                                checked={existingAdj.IND_OVERRIDE__c}
                                disabled>
                            </lightning-input>
                        </div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <lightning-input
                            type="checkbox"
                            label="Override"
                            variant="label-hidden"
                            aria-label="Override Standard Amount"
                            checked={adjustmentDetail.IND_OVERRIDE__c}
                            disabled={isInputDisabled}
                            onchange={handleOverrideChange}>
                        </lightning-input>
                    </template>
                </td>

                <!-- Adjusted Amount -->
                <td class="row-cell slot-cell currency-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Amount">
                            <lightning-formatted-number
                                value={existingAdj.AMT_DETAIL_ADJMT__c}
                                format-style="currency"
                                currency-code="USD">
                            </lightning-formatted-number>
                        </div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <div aria-label="Adjusted Amount">
                            <lightning-formatted-number
                                value={adjustmentDetail.AMT_DETAIL_ADJMT__c}
                                format-style="currency"
                                currency-code="USD">
                            </lightning-formatted-number>
                        </div>
                    </template>
                </td>

                <!-- Existing Adjustment Indicator -->
                <td class="row-cell existing-adjmt-cell" role="gridcell">
                    <div aria-label="Existing Adjustment">{subPaymentDetail.ind_adjmt__c}</div>
                </td>

            </template>
            <!-- END slotCntcheckbox = true -->

            <!-- -------------------------------------------------------- -->
            <!-- SUB-MODE B: slotCntcheckbox = false — Regular Mode       -->
            <!-- -------------------------------------------------------- -->
            <template if:false={slotCntcheckbox}>

                <!-- Selection Checkbox -->
                <td class="row-cell checkbox-cell" role="gridcell">
                    <lightning-input
                        type="checkbox"
                        label="Select"
                        variant="label-hidden"
                        aria-label="Select row for adjustment"
                        checked={adjustmentDetail.Adjustment_Initiated__c}
                        onchange={handleCheckboxChange}>
                    </lightning-input>
                </td>

                <!-- Case ID (shown when IDN_PROVR__c is present) -->
                <template if:true={adjustment.IDN_PROVR__c}>
                    <td class="row-cell readonly-cell" role="gridcell">
                        <div aria-label="Case ID">{authCaseName}</div>
                    </td>
                </template>

                <!-- Provider ID (shown when IDN_CASE__c is present) -->
                <template if:true={adjustment.IDN_CASE__c}>
                    <td class="row-cell readonly-cell" role="gridcell">
                        <div aria-label="Provider ID">{authProviderName}</div>
                    </td>
                </template>

                <!-- Name (First + Last) -->
                <td class="row-cell readonly-cell" role="gridcell">
                    <div aria-label="Name">
                        {authFirstName}
                        &nbsp;
                        {authLastName}
                    </div>
                </td>

                <!-- Care Date -->
                <td class="row-cell readonly-cell" role="gridcell">
                    <div aria-label="Care Date">{subPaymentDetail.dte_care__c}</div>
                </td>

                <!-- Auth Hours -->
                <td class="row-cell hours-cell readonly-cell" role="gridcell">
                    <div aria-label="Authorized Hours">{subPaymentDetail.cde_unit_care_exptd__c}</div>
                </td>

                <!-- Adjusted Auth Hours -->
                <td class="row-cell hours-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Authorized Hours">{existingAdj.NBR_HOURS_AUTH_ADJD__c}</div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <lightning-input
                            type="number"
                            label="Adjusted Auth Hours"
                            variant="label-hidden"
                            aria-label="Adjusted Authorized Hours"
                            data-field="NBR_HOURS_AUTH_ADJD__c"
                            value={adjustmentDetail.NBR_HOURS_AUTH_ADJD__c}
                            max="24"
                            min="0"
                            disabled={isInputDisabled}
                            onchange={handleAmountChange}>
                        </lightning-input>
                    </template>
                </td>

                <!-- Auth Rate Type -->
                <td class="row-cell readonly-cell" role="gridcell">
                    <div aria-label="Authorized Rate Type">{displayRateType}</div>
                </td>

                <!-- Adjusted Rate Type (dropdown) -->
                <td class="row-cell dropdown-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Rate Type">{existingAdj.CDE_TYPE_RATE_ADJD__c}</div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <c-multiselect-combobox
                            label="Adjusted Rate Type"
                            aria-label="Adjusted Rate Type"
                            value={adjustmentDetail.CDE_TYPE_RATE_ADJD__c}
                            options={rateTypeOptions}
                            disabled={isInputDisabled}
                            data-field="CDE_TYPE_RATE_ADJD__c"
                            behavior-type="picklist"
                            hide-label
                            already-has-values
                            onselect={handleSelectChange}>
                        </c-multiselect-combobox>
                    </template>
                </td>

                <!-- Attended Hours -->
                <td class="row-cell hours-cell readonly-cell" role="gridcell">
                    <div aria-label="Attended Hours">{subPaymentDetail.cde_unit_care_actual__c}</div>
                </td>

                <!-- Adjusted Attended Hours -->
                <td class="row-cell hours-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Attended Hours">{existingAdj.NBR_HOURS_ATTND_ADJD__c}</div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <lightning-input
                            type="number"
                            label="Adjusted Attended Hours"
                            variant="label-hidden"
                            aria-label="Adjusted Attended Hours"
                            data-field="NBR_HOURS_ATTND_ADJD__c"
                            value={adjustmentDetail.NBR_HOURS_ATTND_ADJD__c}
                            max="24"
                            min="0"
                            disabled={isInputDisabled}
                            onchange={handleAmountChange}>
                        </lightning-input>
                    </template>
                </td>

                <!-- Unit Paid -->
                <td class="row-cell readonly-cell" role="gridcell">
                    <div aria-label="Unit Paid">{displayUnitPaid}</div>
                </td>

                <!-- Rate Paid -->
                <td class="row-cell currency-cell readonly-cell" role="gridcell">
                    <lightning-formatted-number
                        value={subPaymentDetail.amt_rate__c}
                        format-style="currency"
                        currency-code="USD"
                        aria-label="Rate Paid">
                    </lightning-formatted-number>
                </td>

                <!-- Parent Fee (Copay) -->
                <td class="row-cell currency-cell readonly-cell" role="gridcell">
                    <lightning-formatted-number
                        value={subPaymentDetail.amt_copay__c}
                        format-style="currency"
                        currency-code="USD"
                        aria-label="Parent Fee">
                    </lightning-formatted-number>
                </td>

                <!-- Amount Paid (Total) -->
                <td class="row-cell currency-cell readonly-cell" role="gridcell">
                    <div aria-label="Amount Paid">
                        <lightning-formatted-number
                            value={subPaymentDetail.amt_total__c}
                            format-style="currency"
                            currency-code="USD">
                        </lightning-formatted-number>
                    </div>
                </td>

                <!-- Slot Contract Amount -->
                <td class="row-cell currency-cell readonly-cell" role="gridcell">
                    <div aria-label="Slot Contract Amount Paid">
                        <lightning-formatted-number
                            value={subPaymentDetail.amt_slot_paid__c}
                            format-style="currency"
                            currency-code="USD">
                        </lightning-formatted-number>
                    </div>
                </td>

                <!-- 0-36 Months -->
                <td class="row-cell readonly-cell" role="gridcell">
                    <div aria-label="0-36 Months Enrollment Payment">{enrollmentPaymentIndicator}</div>
                </td>

                <!-- Adjusted Rate Amount (input / read-only) -->
                <td class="row-cell currency-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Rate Amount">
                            <lightning-formatted-number
                                value={existingAdj.AMT_PAID_RATE_ADJD__c}
                                format-style="currency"
                                currency-code="USD">
                            </lightning-formatted-number>
                        </div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <template if:true={adjustmentDetail.IND_OVERRIDE__c}>
                            <lightning-input
                                type="number"
                                label="Adjusted Rate Amount"
                                variant="label-hidden"
                                aria-label="Adjusted Rate Amount"
                                step="0.01"
                                min="0.00"
                                formatter="currency"
                                data-field="AMT_PAID_RATE_ADJD__c"
                                value={adjustmentDetail.AMT_PAID_RATE_ADJD__c}
                                disabled={isInputDisabled}
                                message-when-range-underflow="Negative amounts are not accepted."
                                message-when-step-mismatch="Please enter an amount with two decimal places."
                                onchange={handleAmountChange}>
                            </lightning-input>
                        </template>
                        <template if:false={adjustmentDetail.IND_OVERRIDE__c}>
                            <div aria-label="Adjusted Rate Amount">
                                <lightning-formatted-number
                                    value={adjustmentDetail.AMT_PAID_RATE_ADJD__c}
                                    format-style="currency"
                                    currency-code="USD">
                                </lightning-formatted-number>
                            </div>
                        </template>
                    </template>
                </td>

                <!-- Override Checkbox -->
                <td class="row-cell checkbox-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div>
                            <lightning-input
                                type="checkbox"
                                label="Override"
                                variant="label-hidden"
                                aria-label="Override Standard Amount"
                                checked={existingAdj.IND_OVERRIDE__c}
                                disabled>
                            </lightning-input>
                        </div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <lightning-input
                            type="checkbox"
                            label="Override"
                            variant="label-hidden"
                            aria-label="Override Standard Amount"
                            checked={adjustmentDetail.IND_OVERRIDE__c}
                            disabled={isInputDisabled}
                            onchange={handleOverrideChange}>
                        </lightning-input>
                    </template>
                </td>

                <!-- Adjusted Amount -->
                <td class="row-cell currency-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Amount">
                            <lightning-formatted-number
                                value={existingAdj.AMT_DETAIL_ADJMT__c}
                                format-style="currency"
                                currency-code="USD">
                            </lightning-formatted-number>
                        </div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <div aria-label="Adjusted Amount">
                            <lightning-formatted-number
                                value={adjustmentDetail.AMT_DETAIL_ADJMT__c}
                                format-style="currency"
                                currency-code="USD">
                            </lightning-formatted-number>
                        </div>
                    </template>
                </td>

                <!-- Existing Adjustment Indicator -->
                <td class="row-cell existing-adjmt-cell" role="gridcell">
                    <div aria-label="Existing Adjustment">{subPaymentDetail.ind_adjmt__c}</div>
                </td>

            </template>
            <!-- END slotCntcheckbox = false -->

        </template>
        <!-- END artFeeFlag = false -->

        <!-- ============================================================ -->
        <!-- MODE 2: artFeeFlag = true — ART Fee Row                      -->
        <!-- ============================================================ -->
        <template if:true={artFeeFlag}>
            <template if:false={disabledARTFees}>

                <!-- Selection Checkbox -->
                <!-- ART fee rows bind to adjustmentDetailTemp.Adjustment_Initiated__c (matches Aura original).
                     The setter for adjustmentDetailsARTFeeMap keeps adjustmentDetailTemp in sync
                     when the parent main-row checkbox toggles the map, so this binding is what
                     actually reflects the auto-selection. -->
                <td class="row-cell checkbox-cell art-fee-cell" role="gridcell">
                    <lightning-input
                        type="checkbox"
                        label="Select"
                        variant="label-hidden"
                        aria-label="Select row for ART Fee adjustment"
                        checked={adjustmentDetailTemp.Adjustment_Initiated__c}
                        onchange={handleCheckboxChange}>
                    </lightning-input>
                </td>

                <!-- Name (First + Last) -->
                <td class="row-cell art-fee-cell readonly-cell" role="gridcell">
                    <div aria-label="Name">
                        {authFirstName}
                        &nbsp;
                        {authLastName}
                    </div>
                </td>

                <!-- Care Date -->
                <td class="row-cell art-fee-cell readonly-cell" role="gridcell">
                    <div aria-label="Care Date">{subPaymentDetail.dte_care__c}</div>
                </td>

                <!-- Activity Fee Paid (original) -->
                <td class="row-cell art-fee-cell currency-cell readonly-cell" role="gridcell">
                    <lightning-formatted-number
                        value={subPaymentDetail.amt_act_paid__c}
                        format-style="currency"
                        currency-code="USD"
                        aria-label="Activity Fee Paid">
                    </lightning-formatted-number>
                </td>

                <!-- Registration Fee Paid (original) -->
                <td class="row-cell art-fee-cell currency-cell readonly-cell" role="gridcell">
                    <lightning-formatted-number
                        value={subPaymentDetail.amt_reg_paid__c}
                        format-style="currency"
                        currency-code="USD"
                        aria-label="Registration Fee Paid">
                    </lightning-formatted-number>
                </td>

                <!-- Transportation Fee Paid (original) -->
                <td class="row-cell art-fee-cell currency-cell readonly-cell" role="gridcell">
                    <div aria-label="Transportation Fee Paid">
                        <lightning-formatted-number
                            value={subPaymentDetail.amt_trans_paid__c}
                            format-style="currency"
                            currency-code="USD">
                        </lightning-formatted-number>
                    </div>
                </td>

                <!-- Adjusted Activity Fee -->
                <td class="row-cell art-fee-cell currency-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Activity Fee">{existingAdj.Activity_Fee_Paid__c}</div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <lightning-input
                            type="number"
                            label="Adjusted Activity Fee"
                            variant="label-hidden"
                            aria-label="Adjusted Activity Fee"
                            formatter="currency"
                            step="any"
                            min="0"
                            data-field="Activity_Fee_Paid__c"
                            value={adjustmentDetailTemp.Activity_Fee_Paid__c}
                            disabled={isInputDisabled}
                            onchange={handleAmountChange}>
                        </lightning-input>
                    </template>
                </td>

                <!-- Adjusted Registration Fee -->
                <td class="row-cell art-fee-cell currency-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Registration Fee">{existingAdj.Registration_Fee_Paid__c}</div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <lightning-input
                            type="number"
                            label="Adjusted Registration Fee"
                            variant="label-hidden"
                            aria-label="Adjusted Registration Fee"
                            formatter="currency"
                            step="any"
                            min="0"
                            data-field="Registration_Fee_Paid__c"
                            value={adjustmentDetailTemp.Registration_Fee_Paid__c}
                            disabled={isInputDisabled}
                            onchange={handleAmountChange}>
                        </lightning-input>
                    </template>
                </td>

                <!-- Adjusted Transportation Fee -->
                <td class="row-cell art-fee-cell currency-cell" role="gridcell">
                    <template if:true={isExistingAdj}>
                        <div aria-label="Adjusted Transportation Fee">{existingAdj.Transportation_Fee_Paid__c}</div>
                    </template>
                    <template if:false={isExistingAdj}>
                        <lightning-input
                            type="number"
                            label="Adjusted Transportation Fee"
                            variant="label-hidden"
                            aria-label="Adjusted Transportation Fee"
                            formatter="currency"
                            step="any"
                            min="0"
                            data-field="Transportation_Fee_Paid__c"
                            value={adjustmentDetailTemp.Transportation_Fee_Paid__c}
                            disabled={isInputDisabled}
                            onchange={handleAmountChange}>
                        </lightning-input>
                    </template>
                </td>

            </template>
        </template>
        <!-- END artFeeFlag = true -->

    </tr>
</template>
