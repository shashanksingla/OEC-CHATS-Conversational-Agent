<template>
    <!--  <iframe
        class="dynatrace-frame"
        src={visualforceUrl}
        title="Dynatrace RUM Test">
    </iframe> -->
    <lightning-card icon-name="standard:event">
        <template lwc:if={showSpinner}>
            <lightning-spinner alternative-text="Loading" variant="base"></lightning-spinner>
        </template>
        <h1 slot="title" class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate">
            Income and Parent Fee Calculator
        </h1>
        <c-page-messages_lwc page-messages={pageMessages} message-type={messageType}></c-page-messages_lwc>

        <template if:true={isFirstTab}>
            <lightning-layout multiple-rows="true" horizontal-align="space">
                <lightning-layout-item flexibility="auto" size="6" padding="around-small">
                    <c-multiselect-combobox label="County" value={countySelected} onselect={handleInputChange}
                        behavior-type="picklist" object="User" field="Owner_County__c" show-none="true" required="true"
                        data-id="input-field"></c-multiselect-combobox>
                </lightning-layout-item>

                <lightning-layout-item flexibility="auto" size="6" padding="around-small">
                    <lightning-input type="number" name="familySize" label="Family Size" step="any" value={familySize}
                        message-when-range-underflow="Must be a number greater than 0." required="true" min="1"
                        onchange={handleInputChange} data-id="input-field"></lightning-input>
                </lightning-layout-item>

                <lightning-layout-item flexibility="auto" size="6" padding="around-small">
                    <lightning-input type="number" name="noOfChildReqCare" label="Number of Children Requesting Care"
                        step="any" value={noOfChildReqCare}
                        message-when-range-underflow="Must be a number greater than 0." required="true" min="1"
                        onchange={handleInputChange} data-id="input-field"></lightning-input>
                </lightning-layout-item>

                <lightning-layout-item flexibility="auto" size="6" padding="around-small"></lightning-layout-item>
            </lightning-layout>

            <div class="slds-p-around_small">
                <template if:true={incomeRows}>
                    <c-income-row_lwc income-rows={incomeRows} onincomerowchange={handleIncomeRows}></c-income-row_lwc>
                </template>
            </div>
        </template>

        <div slot="footer">
            <lightning-button class="slds-m-right_xx-small" label="Add more Income" onclick={addIncomeRow}>
            </lightning-button>
            <lightning-button class="slds-m-right_xx-small" label="Clear" onclick={clearFields}></lightning-button>
            <lightning-button label="Calculate" variant="brand" onclick={calculateIncome}></lightning-button>
        </div>

        <lightning-layout multiple-rows="true" horizontal-align="space" class="slds-border_bottom">
            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    Calculated Annual Income : $
                    <lightning-formatted-number value={annualIncome}></lightning-formatted-number>
                </div>
            </lightning-layout-item>

            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    Average Monthly Income : $
                    <lightning-formatted-number value={monthlyIncome}></lightning-formatted-number>
                </div>
            </lightning-layout-item>

            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    FPG % : &nbsp;
                    <lightning-formatted-number value={fpg}></lightning-formatted-number>
                </div>
            </lightning-layout-item>

            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    County Income Celling % : &nbsp;
                    <lightning-formatted-number value={incomeCelling}></lightning-formatted-number>
                </div>
            </lightning-layout-item>
        </lightning-layout>

        <lightning-layout multiple-rows="true" horizontal-align="space">
            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    Full Time Parent Fee :
                    <lightning-formatted-number value={fullTimeFee} maximum-fraction-digits="2" format-style="currency"
                        currency-code="USD"></lightning-formatted-number>
                </div>
            </lightning-layout-item>

            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    Part Time Parent Fee :
                    <lightning-formatted-number value={partTimeFee} maximum-fraction-digits="2" format-style="currency"
                        currency-code="USD"></lightning-formatted-number>
                </div>
            </lightning-layout-item>

            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    Quality Rating Discounted Full Time Parent Fee : $
                    <lightning-formatted-number value={fullTimeFeeDiscounted}></lightning-formatted-number>
                </div>
            </lightning-layout-item>

            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    Quality Rating Discounted Part Time Parent Fee : $
                    <lightning-formatted-number value={partTimeFeeDiscounted}></lightning-formatted-number>
                </div>
            </lightning-layout-item>

            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    FPG Based on Countable Income % : &nbsp;
                    <lightning-formatted-number value={fbgIncome}></lightning-formatted-number>
                </div>
            </lightning-layout-item>

            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    County Maximum Income : $
                    <lightning-formatted-number value={countyMaxIncome}></lightning-formatted-number>
                </div>
            </lightning-layout-item>

            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    85% SMI : &nbsp;
                    <lightning-formatted-number value={SMI}></lightning-formatted-number>
                </div>
            </lightning-layout-item>

            <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                <div class="slds-p-left_medium slds-p-around_x-small">
                    Base Parent Fee for first child : $
                    <lightning-formatted-number value={baseParentFee}></lightning-formatted-number>
                </div>
            </lightning-layout-item>
            <template if:false={pfChangeEffective}>
                <lightning-layout-item flexibility="auto" size="3" padding="around-small">
                    <div class="slds-p-left_medium slds-p-around_x-small">
                        Amount added for each additional child : $
                        <lightning-formatted-number value={addOnFee}></lightning-formatted-number>
                    </div>
                </lightning-layout-item>
            </template>
            <lightning-layout-item flexibility="auto" size="9" padding="around-small"></lightning-layout-item>
        </lightning-layout>
    </lightning-card>   

</template>
