<template>
    <div class={cellClass}>
        <template if:true={hasDay}>
            <lightning-layout multiple-rows="true" vertical-align="space">
                <lightning-layout-item flexibility="auto" size="6">
                    <h2 class="slds-section__title">{dayInCalendar}</h2>
                </lightning-layout-item>
                
                <lightning-layout-item flexibility="auto" size="9">
                    <lightning-input type="number" name={key} label="Hours:" value={anAuthEncmbr.cnt_hour_care__c}
                        min="0" max="24" step="1" onchange={handleHoursChange} disabled={isCntHrReadOnly}
                        required={hoursRequired}>
                    </lightning-input>
                    <template if:true={recordError}>
                        <span class="slds-has-error slds-form-element__help">
                            {recordError}
                        </span>
                    </template>
                </lightning-layout-item>
                
                <lightning-layout-item flexibility="auto" size="9">
                    Unit:
                    <lightning-formatted-text value={unitDisplay}></lightning-formatted-text>
                </lightning-layout-item>
                
                <lightning-layout-item flexibility="auto" size="9">
                    <lightning-select name="rateType" label="Rate Type" value={anAuthEncmbr.cde_type_unit_care__c}
                        options={rateTypeOptions} onchange={handleRateTypeChange} disabled={isRateTypeReadOnly}
                        required={hoursRequired}>
                    </lightning-select>
                </lightning-layout-item>
            </lightning-layout>
        </template>
    </div>
</template>
