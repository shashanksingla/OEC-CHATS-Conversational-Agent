<template>
    <template lwc:if={showSpinner}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>
    <lightning-card icon-name="standard:event">
        <h1 slot="title" class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate">
            {cardTitle}
        </h1>

        <div slot="footer">
            <lightning-button label="Save" variant="brand" onclick={handleSave} class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button label="Cancel" variant="brand" onclick={handleCancel}>
            </lightning-button>
        </div>

        <div class="slds-p-horizontal_small">
            <!-- Page Messages -->
            <template lwc:if={hasPageMessages}>
                <c-page-messages_lwc page-messages={pageMessages} message-type={messageType}>
                </c-page-messages_lwc>
            </template>

            <div class="slds-form_stacked">
                <div class="slds-card">
                    <div class="slds-card__body slds-card__body_inner">
                        <lightning-layout multiple-rows="true" horizontal-align="space">
                            <!-- Authorization Id Lookup -->
                            <lightning-layout-item flexibility="auto" size="6" padding="around-small">
                                <c-custom-lookup_lwc data-id="input-field" label="Authorization Id"
                                    object-api-name="T_AUTH__c" search-field="Name"
                                    selected-record-id={authId} required="true"
                                    enable-error="true"
                                    onvalueselected={handleAuthIdChange} hide-recent-records>
                                </c-custom-lookup_lwc>
                            </lightning-layout-item>


                            <!-- Description -->
                            <lightning-layout-item flexibility="auto" size="6" padding="around-small">
                                <lightning-textarea data-id="input-field" name="Description" label="Description"
                                    value={note} max-length="2000" required="true"
                                    onchange={handleDescriptionChange}>
                                </lightning-textarea>
                            </lightning-layout-item>
                            <!-- Empty layout item for spacing -->
                            <lightning-layout-item flexibility="auto" size="6" padding="around-small">
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
