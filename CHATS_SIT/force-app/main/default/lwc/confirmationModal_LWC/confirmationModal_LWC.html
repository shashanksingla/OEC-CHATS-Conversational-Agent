<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <div class="slds-modal__header">
                <template if:true={showCloseButton}>
                    <button class="slds-button slds-modal__close slds-button_icon" title="Close" aria-label="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="close" variant="base">
                        </lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </template>                    
                <h2 id="dialog-header" class="slds-text-heading--medium">{title}</h2>
            </div>
            <div class="slds-modal__content slds-p-around--medium">
                {confirmMsg}
            </div>
            <div class="slds-modal__footer">
                <template if:true={showNoButton}>
                    <button class="slds-button slds-button_neutral" onclick={handleNoClick} aria-label={noLabel}>{noLabel}</button>
                </template>
                <template if:true={showYesButton}>
                    <button class="slds-button slds-button_brand" onclick={handleYesClick} aria-label={yesLabel}>{yesLabel}</button>
                </template>                    
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
