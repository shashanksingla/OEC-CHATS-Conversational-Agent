<template>
    <lightning-card icon-name={iconName}>
        <div slot="title">
            <h2 class="slds-card__header-title">{componentTitle}</h2>
        </div>
        <div slot="actions">
            <lightning-button
                variant="brand"
                label="Link Record"
                icon-name="utility:add"
                onclick={handleOpenModal}
                disabled={showSpinner}>
            </lightning-button>
        </div>

        <!-- Spinner -->
        <template lwc:if={showSpinner}>
            <div class="spinner-container">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <!-- Linked records table -->
        <div class="slds-card__body slds-card__body_inner">
            <template lwc:if={hasRecords}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped" role="grid">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" class="slds-text-title_caps">
                                <div class="slds-truncate" title="Record">{relatedObjectLabel}</div>
                            </th>
                            <template lwc:if={isAdmin}>
                                <th scope="col" class="slds-text-title_caps col-action">
                                    <div class="slds-truncate" title="Action">Action</div>
                                </th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={linkedRecords} for:item="rec">
                            <tr key={rec.junctionId} class="slds-hint-parent">
                                <td data-label="Record">
                                    <div class="slds-truncate record-name">
                                        <lightning-icon
                                            icon-name={iconName}
                                            size="x-small"
                                            class="slds-m-right_x-small">
                                        </lightning-icon>
                                        <a
                                            href={rec.recordUrl}
                                            title={rec.relatedRecordName}>
                                            {rec.relatedRecordName}
                                        </a>
                                    </div>
                                </td>
                                <template lwc:if={isAdmin}>
                                    <td data-label="Action" class="col-action">
                                        <lightning-button-icon
                                            icon-name="utility:delete"
                                            variant="bare"
                                            alternative-text="Remove link"
                                            title="Remove link"
                                            data-junction-id={rec.junctionId}
                                            data-record-name={rec.relatedRecordName}
                                            onclick={handleDeleteClick}>
                                        </lightning-button-icon>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template lwc:if={isEmpty}>
                <div class="slds-align_absolute-center slds-p-vertical_medium empty-state">
                    <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <span class="slds-text-color_weak">No linked records found.</span>
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- ── Link modal ──────────────────────────────────────────────────────── -->
    <template lwc:if={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading" class="slds-modal__title slds-hyphenate">Link {relatedObjectLabel}</h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content">
                    <template lwc:if={modalError}>
                        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                            <lightning-icon icon-name="utility:error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            {modalError}
                        </div>
                    </template>

                    <div class="slds-form-element">
                        <c-custom-lookup_lwc
                            label={relatedObjectLabel}
                            object-api-name={relatedObjectApiName}
                            search-field={relatedRecordNameField}
                            selected-icon-name={iconName}
                            placeholder="Search..."
                            required
                            unique-key="linkedRecordLookup"
                            onvalueselected={handleLookupSelect}>
                        </c-custom-lookup_lwc>
                    </div>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={handleCloseModal}>
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Link"
                        onclick={handleSaveLink}
                        disabled={isSaving}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ── Delete confirmation modal ──────────────────────────────────────── -->
    <template lwc:if={showDeleteModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="delete-modal-heading" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header slds-theme_warning">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={handleCancelDelete}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="delete-modal-heading" class="slds-modal__title slds-hyphenate">Confirm Remove Link</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="delete-modal-content">
                    <p>Are you sure you want to remove the link to <strong>{deleteTargetName}</strong>?</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={handleCancelDelete}>
                    </lightning-button>
                    <lightning-button
                        variant="destructive"
                        label="Remove"
                        onclick={handleConfirmDelete}
                        disabled={isDeleting}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
