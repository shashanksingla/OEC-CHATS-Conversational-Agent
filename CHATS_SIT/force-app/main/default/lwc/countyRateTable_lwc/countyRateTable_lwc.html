<template>
    <div style="background:white" class="slds-p-around_medium">
        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered" role="grid"
            style="border: 1px solid">
            <thead>
                <tr class="slds-line-height_reset">
                    <th scope="col" rowspan="2">Rate Type+Age Group</th>
                    <template if:true={columns} for:each={columns} for:item="colVal">
                        <th scope="col" colspan={colVal.colspan} key={colVal.label}>{colVal.label}</th>
                    </template>
                    <template if:false={isApproved}>
                        <th scope="col" rowspan="2">Feedback</th>
                    </template>
                </tr>
            </thead>
            <tbody>
                <template lwc:if={isExempt}>
                    <template if:true={formattedRates} for:each={formattedRates} for:item="row">
                        <tr key={row.key}>
                            <td>
                                <div style="display:inline-flex">
                                    <label class={row.diffCatClass}
                                        for={row.key}>{row.rType}<br />{row.ageGroup}</label>
                                </div>
                            </td>
                            <td>
                                <p><lightning-formatted-number class={row.unitPTcls} value={row.unitPTAmt}
                                        maximum-fraction-digits="2"
                                        minimum-fraction-digits="2"></lightning-formatted-number></p>

                            </td>
                            <td>
                                <p><lightning-formatted-number class={row.unitFTcls} value={row.unitFTAmt}
                                        maximum-fraction-digits="2"
                                        minimum-fraction-digits="2"></lightning-formatted-number></p>

                            </td>
                            <td>
                                <p><lightning-formatted-number class={row.unitFTPTcls} value={row.unitFTPTAmt}
                                        maximum-fraction-digits="2"
                                        minimum-fraction-digits="2"></lightning-formatted-number></p>

                            </td>
                            <td>
                                <p><lightning-formatted-number class={row.unitFTFTcls} value={row.unitFTFTAmt}
                                        maximum-fraction-digits="2"
                                        minimum-fraction-digits="2"></lightning-formatted-number></p>
                            </td>
                            <template if:false={isApproved}>
                                <td>
                                    <template lwc:if={isViewOnly}>
                                        <p><lightning-formatted-text value={row.feedback}></lightning-formatted-text>
                                        </p>
                                    </template>
                                    <template lwc:else>
                                        <c-custom-feedback-box identifier={row.key} feedback={row.feedback}
                                            onpassfeedback={handleFeedback}
                                            screen-mode={screenMode}></c-custom-feedback-box>
                                    </template>
                                </td>
                            </template>
                        </tr>
                    </template>
                </template>
                <template lwc:else>
                    <tr class="subheaderRow">
                        <td></td>
                        <td>Care Unit</td>
                        <td>Amount</td>
                        <td>Care Unit</td>
                        <td>Amount</td>
                        <td>Care Unit</td>
                        <td>Amount</td>
                        <td>Care Unit</td>
                        <td>Amount</td>
                        <td>Care Unit</td>
                        <td>Amount</td>
                        <template if:false={isApproved}>
                            <td></td>
                        </template>
                    </tr>
                    <template if:true={formattedRates} for:each={formattedRates} for:item="row">
                        <tr key={row.key}>
                            <template lwc:if={row.isGroupKey}>
                                <td rowspan="4">
                                    <div style="display:inline-flex">
                                        <label class={row.diffCatClass}
                                            for={row.key}>{row.rType}<br />{row.ageGroup}</label>
                                    </div>
                                </td>
                            </template>
                            <td>
                                {row.unit}
                            </td>
                            <td>
                                <p><lightning-formatted-number class={row.tier1cls} value={row.tier1Amt}
                                        maximum-fraction-digits="2"
                                        minimum-fraction-digits="2"></lightning-formatted-number></p>
                            </td>
                            <td>
                                {row.unit}
                            </td>
                            <td>
                                <p><lightning-formatted-number class={row.tier2cls} value={row.tier2Amt}
                                        maximum-fraction-digits="2"
                                        minimum-fraction-digits="2"></lightning-formatted-number></p>
                            </td>
                            <td>
                                {row.unit}
                            </td>
                            <td>
                                <p><lightning-formatted-number class={row.tier3cls} value={row.tier3Amt}
                                        maximum-fraction-digits="2"
                                        minimum-fraction-digits="2"></lightning-formatted-number></p>
                            </td>
                            <td>
                                {row.unit}
                            </td>
                            <td>
                                <p><lightning-formatted-number class={row.tier4cls} value={row.tier4Amt}
                                        maximum-fraction-digits="2"
                                        minimum-fraction-digits="2"></lightning-formatted-number></p>
                            </td>
                            <td>
                                {row.unit}
                            </td>
                            <td>
                                <p><lightning-formatted-number class={row.tier5cls} value={row.tier5Amt}
                                        maximum-fraction-digits="2"
                                        minimum-fraction-digits="2"></lightning-formatted-number></p>
                            </td>
                            <template if:false={isApproved}>
                                <template lwc:if={row.isGroupKey}>
                                    <td rowspan="4">
                                        <template lwc:if={isViewOnly}>
                                            <p><lightning-formatted-text
                                                    value={row.feedback}></lightning-formatted-text>
                                            </p>
                                        </template>
                                        <template lwc:else>
                                            <c-custom-feedback-box identifier={row.key} feedback={row.feedback}
                                                onpassfeedback={handleFeedback}
                                                screen-mode={screenMode}></c-custom-feedback-box>
                                        </template>
                                    </td>
                                </template>
                            </template>
                        </tr>
                    </template>
                </template>
            </tbody>
        </table>
    </div>
</template>
