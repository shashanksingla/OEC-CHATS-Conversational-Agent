<template>
    <lightning-layout multiple-rows="true" horizontal-align="space" role="form"
        aria-label="Adjustment Information Form">

        <!-- ═══════════════════════════════════════════════════════════════
             Reimbursable (always visible)
        ════════════════════════════════════════════════════════════════ -->
        <lightning-layout-item flexibility="auto" padding="around-small" size="12">
            <c-output-field_lwc label="Reimbursable" value={adjustment.IND_REIMBSL_PMT__c}></c-output-field_lwc>
        </lightning-layout-item>

        <!-- ═══════════════════════════════════════════════════════════════
             Recovery-type fields: Classification Type & Court Ordered Adjustment
        ════════════════════════════════════════════════════════════════ -->
        <template lwc:if={isRecoveryType}>

            <!-- Classification Type -->
            <lightning-layout-item flexibility="auto" padding="around-small" size="6">
                <template lwc:if={isViewMode}>
                    <c-output-field_lwc label="Classification Type"
                        value={adjustment.CDE_TYPE_CLSFN__c}></c-output-field_lwc>
                </template>
                <template lwc:else>
                    <c-multiselect-combobox data-id="input-field" label="Classification Type"
                        value={adjustment.CDE_TYPE_CLSFN__c} object="T_ADJMT__c" field="CDE_TYPE_CLSFN__c"
                        required="true" show-none="true" match-with-label behavior-type="picklist"
                        onselect={handleClassificationTypeChange}>
                    </c-multiselect-combobox>
                </template>
            </lightning-layout-item>

            <!-- Court Ordered Adjustment -->
            <lightning-layout-item flexibility="auto" padding="around-small" size="6">
                <template lwc:if={isViewMode}>
                    <c-output-field_lwc label="Court Ordered Adjustment"
                        value={adjustment.IND_ORD_COURT_ADJMT__c}></c-output-field_lwc>
                </template>
                <template lwc:else>
                    <c-multiselect-combobox data-id="input-field" label="Court Ordered Adjustment"
                        value={adjustment.IND_ORD_COURT_ADJMT__c} object="T_ADJMT__c" field="IND_ORD_COURT_ADJMT__c"
                        required="true" show-none="true" match-with-label behavior-type="picklist"
                        onselect={handleCourtOrderedAdjustmentChange}>
                    </c-multiselect-combobox>
                </template>
            </lightning-layout-item>

            <!-- Recovery Initiative (only when Recovery type AND case exists) -->
            <template lwc:if={isRecoveryWithCase}>
                <lightning-layout-item flexibility="auto" padding="around-small" size="6">
                    <template lwc:if={isViewMode}>
                        <c-output-field_lwc label="Recovery Initiative"
                            value={adjustment.Recovery_Initiative__c}></c-output-field_lwc>
                    </template>
                    <template lwc:else>
                        <c-multiselect-combobox data-id="input-field" label="Recovery Initiative"
                            value={adjustment.Recovery_Initiative__c} object="T_ADJMT__c" field="Recovery_Initiative__c"
                            required={isRecoveryInitiativeRequired} show-none="true" behavior-type="picklist"
                            onselect={handleRecoveryInitiativeChange}>
                        </c-multiselect-combobox>
                    </template>
                </lightning-layout-item>
                <!-- Spacer column to maintain grid alignment -->
                <lightning-layout-item flexibility="auto" padding="around-small" size="6"></lightning-layout-item>
            </template>

        </template>
        <!-- END isRecoveryType -->

        <!-- ═══════════════════════════════════════════════════════════════
             Adjustment Reason Section (hidden when only 1 reason option)
        ════════════════════════════════════════════════════════════════ -->
        <template lwc:if={showAdjustmentReasonSection}>

            <!-- Section header -->
            <lightning-layout-item flexibility="auto" padding="around-small" size="12" id="adjustment-reason-section"
                aria-labelledby="adjustment-reason-heading">
                <h3 class="slds-section__title" id="adjustment-reason-heading">Adjustment Reason</h3>
            </lightning-layout-item>

            <!-- Adjustment Reason picklist -->
            <lightning-layout-item flexibility="auto" padding="around-small" size="6">
                <template lwc:if={isViewMode}>
                    <c-output-field_lwc label="Adjustment Reason" value={adjustment.CDE_REASON__c}></c-output-field_lwc>
                </template>
                <template lwc:else>
                    <c-multiselect-combobox data-id="input-field" label="Adjustment Reason" required="true"
                        object="T_ADJMT__c" field="CDE_REASON__c" value={adjustment.CDE_REASON__c}
                        options={adjustmentReasonOptions} match-with-label multi-select already-has-values="true"
                        onselect={handleAdjustmentReasonChange}>
                    </c-multiselect-combobox>
                </template>
            </lightning-layout-item>

            <!-- Reason for Edit (Recovery type only) -->
            <lightning-layout-item flexibility="auto" padding="around-small" size="6">
                <template lwc:if={isRecoveryType}>
                    <template lwc:if={isViewMode}>
                        <c-output-field_lwc label="Reason for Edit"
                            value={adjustment.CDE_EDIT_REASON__c}></c-output-field_lwc>
                    </template>
                    <template lwc:else>
                        <c-multiselect-combobox data-id="input-field" label="Reason for Edit" show-none="true"
                            match-with-label value={adjustment.CDE_EDIT_REASON__c} object="T_ADJMT__c"
                            field="CDE_EDIT_REASON__c" required={isReasonForEditRequired} behavior-type="picklist"
                            onselect={handleReasonForEditChange}>
                        </c-multiselect-combobox>
                    </template>
                </template>
            </lightning-layout-item>

        </template>
        <!-- END showAdjustmentReasonSection -->

        <!-- ═══════════════════════════════════════════════════════════════
             Responsible Party component (Recovery + Case only)
             Two-way binding: listens for responsiblepartylistchange event
        ════════════════════════════════════════════════════════════════ -->
        <template lwc:if={isRecoveryWithCase}>
            <lightning-layout-item flexibility="auto" padding="around-small" size="12" id="resp-party-section">
                <h3 class="slds-section__title" id="resp-party-heading">Responsible Party</h3>
            </lightning-layout-item>
            <lightning-layout-item flexibility="auto" padding="around-small" size="12">
                <template lwc:if={isViewMode}>
                    <div role="region" aria-labelledby="resp-party-heading"
                        class="slds-wrap slds-p-around--small slds-scrollable slds-m-bottom_medium" tabindex="0">
                        <table class="slds-table slds-table_bordered" role="grid" aria-label="Responsible Party List">
                            <thead>
                                <tr role="row" class="slds-text-title_caps">
                                    <th role="columnheader" scope="col">
                                        <div class="slds-truncate" title="Responsibility Party">Responsibility Party
                                        </div>
                                    </th>
                                    <th role="columnheader" scope="col">
                                        <div class="slds-truncate" title="IPV Record ID">IPV Record ID</div>
                                    </th>
                                    <th role="columnheader" scope="col" aria-label="Actions">
                                        <div class="slds-truncate"></div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={responsiblePartyList} for:item="respParty">
                                    <c-adjustment-flow_-responsible-party-flow_lwc key={respParty.IDN_CLIENT__c}
                                        responsible-party-obj={respParty} adjustment={adjustment} page-mode={pageMode}
                                        oncreaterespparty={handleCreateRespParties}>
                                    </c-adjustment-flow_-responsible-party-flow_lwc>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else>
                    <div role="region" aria-labelledby="resp-party-heading"
                        class="slds-wrap slds-p-around--small slds-scrollable slds-p-bottom_medium slds-m-bottom_medium"
                        tabindex="0">
                        <table class="slds-table slds-table_bordered" role="grid" aria-label="Responsible Party List">
                            <thead>
                                <tr role="row" class="slds-text-title_caps">
                                    <th role="columnheader" scope="col" aria-label="Select">
                                        <div class="slds-truncate"></div>
                                    </th>
                                    <th role="columnheader" scope="col">
                                        <div class="slds-truncate" title="Responsibility Party">Responsibility Party
                                        </div>
                                    </th>
                                    <th role="columnheader" scope="col">
                                        <div class="slds-truncate" title="IPV Record ID">IPV Record ID</div>
                                    </th>
                                    <th role="columnheader" scope="col" aria-label="Actions">
                                        <div class="slds-truncate"></div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={responsiblePartyList} for:item="respParty">
                                    <c-adjustment-flow_-responsible-party-flow_lwc key={respParty.IDN_CLIENT__c}
                                        responsible-party-obj={respParty} adjustment={adjustment}
                                        responsible-party-list={responsiblePartyList} page-mode={pageMode}
                                        oncreaterespparty={handleCreateRespParties}>
                                    </c-adjustment-flow_-responsible-party-flow_lwc>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </lightning-layout-item>
            <lightning-layout-item flexibility="auto" padding="around-small" size="12">
                <!-- Iterated address/responsible-party address cards -->
                <template for:each={responsiblePartiesAddressList} for:item="addressObj">
                    <c-adjustment-address-resp-party_lwc key={addressObj.Id} data-id="adjustmentAddressRespParty"
                        adjustment={adjustment} address={addressObj} is-editable-address={isEditableAddress}
                        page-mode={pageMode} onrespaddresschange={handleRespPartyAddressUpdate}>
                    </c-adjustment-address-resp-party_lwc>
                </template>
            </lightning-layout-item>
        </template>
        <template lwc:else>
            <!-- Single adjustment address (non-Recovery or no case) -->
            <!-- prov-editable-address mirrors Aura: provEditableAddress="{!(v.adjustment.CDE_STATUS_ADJMT__c=='Calculation Complete')}" -->
            <c-adjustment-address_lwc data-id="adjustmentAddress" adjustment={adjustment} address={address}
                prov-editable-address={isProvEditableAddress} page-mode={pageMode} onaddresschange={handleAddressUpdate}>
            </c-adjustment-address_lwc>
        </template>

        <!-- ══════showAdjNoteModal═════════════════════════════════════════════
             Classification Type confirmation modal (Recovery type only)
        ════════════════════════════════════════════════════════════════ -->
        <template lwc:if={isRecoveryType}>
            <template lwc:if={showClassificationTypeModal}>
                <c-confirmation-modal_-l-w-c data-id="classificationTypeModal"
                    confirm-msg={label.adjustment_error_otherRecoveries} show-no-button="" yes-label="Ok"
                    onyes={confirmOK} onno={handleModalClose}>
                </c-confirmation-modal_-l-w-c>
            </template>
        </template>

    </lightning-layout>
</template>
